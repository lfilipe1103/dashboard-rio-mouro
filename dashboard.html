<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Dashboard V6</title>

<style>

:root{

    --bg:#050505;
    --card:#13213a;
    --card2:#223758;
    --border:#32496f;

    --gold:#ffd700;
    --green:#22c55e;
    --yellow:#facc15;
    --red:#ef4444;

}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:
    radial-gradient(
        circle at top,
        #12203a,
        #050505
    );

    color:white;

    font-family:
    "Segoe UI",
    Arial,
    sans-serif;

    padding:15px;

}

.container{

    max-width:900px;
    margin:auto;

}

.card{

    background:
    linear-gradient(
        180deg,
        #13213a,
        #1d2f4d
    );

    border:1px solid var(--border);

    border-radius:24px;

    padding:20px;

    margin-bottom:15px;

}

.titulo{

    font-size:22px;

    font-weight:800;

    margin-bottom:18px;

}

.logo{

    width:90px;

    margin-bottom:15px;

}

.hero{

    text-align:center;

}

.jogo{

    font-size:34px;

    font-weight:900;

    line-height:1.3;

}

.data{

    margin-top:15px;

    color:var(--gold);

    font-size:18px;

    font-weight:bold;

}

.local{

    margin-top:10px;

    color:#c4d0e0;

}

.alertas{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:12px;

}

.alerta{

    background:var(--card2);

    border-radius:18px;

    padding:18px;

    text-align:center;

}

.alerta-num{

    font-size:42px;

    font-weight:900;

}

.ficha-adv{

    text-align:center;

}

.nome-adv{

    font-size:34px;

    font-weight:900;

    margin-bottom:15px;

}

.resumo-adv{

    font-size:18px;

    line-height:1.8;

}

.box{

    background:var(--card2);

    border-radius:12px;

    padding:14px;

    margin-bottom:10px;

}

.risco{

    background:var(--card2);

    border-radius:12px;

    padding:14px;

    margin-bottom:10px;

    display:flex;

    justify-content:space-between;

}

.linha{

    background:var(--card2);

    border-radius:12px;

    padding:14px;

    margin-bottom:10px;

    display:flex;

    justify-content:space-between;

}

.voltar{

    width:100%;

    border:none;

    border-radius:18px;

    padding:18px;

    background:
    linear-gradient(
        135deg,
        #35589b,
        #4a78d1
    );

    color:white;

    font-size:18px;

    font-weight:700;

    cursor:pointer;

}

.footer{

    text-align:center;

    color:#9fb0c9;

    margin-top:15px;

}

</style>

</head>

<body>

<div class="container">

    <!-- PRÓXIMO JOGO -->

    <div class="card hero">

        <img
            src="logo.png"
            class="logo">

        <div
            id="jogo"
            class="jogo">

            A carregar...

        </div>

        <div
            id="dataJogo"
            class="data">

        </div>

        <div
            id="localJogo"
            class="local">

        </div>

    </div>

    <!-- SITUAÇÃO EQUIPA -->

    <div class="card">

        <div class="titulo">

            🚨 Situação da Equipa

        </div>

        <div class="alertas">

            <div class="alerta">

                <div
                    id="numCastigados"
                    class="alerta-num"
                    style="color:#ef4444">

                    0

                </div>

                <div>

                    Castigados

                </div>

            </div>

            <div class="alerta">

                <div
                    id="numRisco"
                    class="alerta-num"
                    style="color:#facc15">

                    0

                </div>

                <div>

                    Em Risco

                </div>

            </div>

        </div>

    </div>

    <!-- ADVERSÁRIO -->

    <div class="card">

        <div class="titulo">

            ⚔️ Adversário

        </div>

        <div class="ficha-adv">

            <div
                id="nomeAdversario"
                class="nome-adv">

                -

            </div>

            <div
                id="resumoAdversario"
                class="resumo-adv">

                -

            </div>

        </div>

    </div>

          <!-- ÚLTIMOS RESULTADOS -->

    <div class="card">

        <div class="titulo">

            📅 Últimos Resultados do Adversário

        </div>

        <div
            id="ultimosResultados">

        </div>

    </div>

    <!-- CASTIGADOS -->

    <div class="card">

        <div class="titulo">

            🚫 Castigados

        </div>

        <div
            id="castigados">

        </div>

    </div>

    <!-- RISCO -->

    <div class="card">

        <div class="titulo">

            ⚠️ Jogadores em Risco

        </div>

        <div
            id="risco">

        </div>

    </div>

    <!-- ARBITRAGEM -->

    <div class="card">

        <div class="titulo">

            👨‍⚖️ Arbitragem

        </div>

        <div
            id="arbitragem">

        </div>

    </div>

    <!-- PROXIMO ADVERSARIO -->

    <div class="card">

        <div class="titulo">

            ⏭️ Próximo Adversário

        </div>

        <div
            id="proximoAdversario"
            class="ficha-adv">

        </div>

    </div>

    <button
        class="voltar"
        onclick="
        location.href='index.html'
        ">

        ⬅️ Voltar

    </button>

    <div
        id="atualizacao"
        class="footer">

    </div>

</div>

<script>

async function carregar(){

    const r =
    await fetch(
        "dashboard_data.json?t="
        + Date.now()
    );

    const d =
    await r.json();

    const s =
    d.seniores || {};

    const adv =
    d.dashboard?.adversario || {};

    // jogo

    document.getElementById(
        "jogo"
    ).innerHTML =

    `${s.proximo_jogo.casa}
    <br>VS<br>
    ${s.proximo_jogo.fora}`;

    document.getElementById(
        "dataJogo"
    ).innerHTML =

    `📅 ${s.proximo_jogo.data}
     • ${s.proximo_jogo.hora}`;

    document.getElementById(
        "localJogo"
    ).innerHTML =

    `🏟️ ${s.proximo_jogo.estadio}`;

    // alertas

    document.getElementById(
        "numCastigados"
    ).innerText =

    s.castigos?.ativos || 0;

    document.getElementById(
        "numRisco"
    ).innerText =

    (s.cartoes?.risco || []).length;

    // adversário

    document.getElementById(
        "nomeAdversario"
    ).innerText =

    adv.nome || "-";

    document.getElementById(
        "resumoAdversario"
    ).innerHTML =

    `
    🏆 ${adv.posicao || "-"}º Lugar
    <br>
    📊 ${adv.pontos || "-"} Pontos
    <br><br>
    ✅ ${adv.vitorias || 0} Vitória(s)
    <br>
    🤝 ${adv.empates || 0} Empate(s)
    <br>
    ❌ ${adv.derrotas || 0} Derrota(s)
    <br><br>
    ⚽ ${adv.gm || 0} GM
    <br>
    🥅 ${adv.gs || 0} GS
    <br>
    📉 DG ${adv.dg || "-"}
    `;

    // resultados

    let resultados = "";

    (adv.ultimos_resultados || [])
    .forEach(j => {

        let icon = "🟡";

        if(j.estado === "V")
            icon = "🟢";

        if(j.estado === "D")
            icon = "🔴";

        resultados += `
        <div class="box">
            ${icon}
            ${j.data}
            •
            ${j.texto}
        </div>
        `;
    });

    document.getElementById(
        "ultimosResultados"
    ).innerHTML =
    resultados;

    // castigados

    let cast = "";

    if(
        (s.castigos?.lista || [])
        .length === 0
    ){

        cast =
        `<div class="box">
        ✅ Sem castigados
        </div>`;

    }
    else{

        s.castigos.lista.forEach(x=>{

            cast += `
            <div class="box">
                🚫 ${x.nome}
            </div>
            `;

        });

    }

    document.getElementById(
        "castigados"
    ).innerHTML = cast;

    // risco

    let risco = "";

    (s.cartoes?.risco || [])
    .forEach(x=>{

        risco += `
        <div class="risco">

            <span>
                🟨 ${x.nome}
            </span>

            <strong>
                ${x.cartoes}
            </strong>

        </div>
        `;

    });

    document.getElementById(
        "risco"
    ).innerHTML = risco;

    // arbitragem

    let arb = `
    <div class="linha">
        <span>Árbitro</span>
        <strong>
            ${s.proximo_jogo.arbitro}
        </strong>
    </div>
    `;

    (s.proximo_jogo.assistentes || [])
    .forEach(a=>{

        arb += `
        <div class="linha">
            <span>Assistente</span>
            <strong>${a}</strong>
        </div>
        `;

    });

    document.getElementById(
        "arbitragem"
    ).innerHTML = arb;

    // próximo adversário

    document.getElementById(
        "proximoAdversario"
    ).innerHTML =

    `
    <div class="data">
        📅 Próxima Jornada
    </div>

    <div class="nome-adv">
        ⚔️ ${s.proximo_adversario?.nome || "-"}
    </div>
    `;

    document.getElementById(
        "atualizacao"
    ).innerHTML =

    "Atualizado: "
    + d.ultima_atualizacao;

}

carregar();

</script>

</body>
</html>
