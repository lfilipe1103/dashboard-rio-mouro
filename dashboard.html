<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>GD Rio de Mouro Dashboard</title>

<style>

:root{

    --bg:#050505;
    --card:#13213a;
    --card2:#1c2d4a;
    --border:#2d4369;

    --yellow:#facc15;
    --green:#22c55e;
    --red:#ef4444;
    --blue:#3b82f6;

    --text:#ffffff;
    --muted:#9fb0c9;

}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:var(--bg);
    color:var(--text);
    font-family:"Segoe UI",Arial,sans-serif;
    padding:15px;

}

.container{

    max-width:1200px;
    margin:auto;

}

.card{

    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:18px;
    margin-bottom:12px;

}

.hero{

    background:
    linear-gradient(
        135deg,
        #13213a,
        #1c2d4a
    );

    text-align:center;

}

.logo{

    font-size:50px;
    margin-bottom:10px;

}

.hero h1{

    margin-bottom:15px;

}

.jogo{

    font-size:34px;
    font-weight:700;
    line-height:1.4;

}

.data{

    margin-top:12px;
    color:var(--yellow);
    font-size:18px;

}

.estadio{

    margin-top:10px;
    color:var(--muted);

}

.grid-kpi{

    display:grid;
    grid-template-columns:
    repeat(4,1fr);
    gap:12px;
    margin-bottom:12px;

}

.grid-duplo{

    display:grid;
    grid-template-columns:
    1fr 1fr;
    gap:12px;
    margin-bottom:12px;

}

.kpi{

    text-align:center;
    transition:.2s;

}

.kpi:hover{

    transform:translateY(-3px);

}

.kpi-numero{

    font-size:42px;
    font-weight:700;

}

.kpi-label{

    color:var(--muted);

}

.amarelo{
    color:var(--yellow);
}

.verde{
    color:var(--green);
}

.vermelho{
    color:var(--red);
}

.azul{
    color:var(--blue);
}

.titulo{

    font-size:20px;
    font-weight:700;

    padding-bottom:10px;
    margin-bottom:15px;

    border-bottom:
    1px solid var(--border);

}

.alerta{

    background:var(--card2);
    border-radius:12px;
    padding:12px;
    margin-bottom:8px;

}

.jogador{

    background:var(--card2);

    border-radius:12px;
    padding:12px;

    margin-bottom:8px;

    display:flex;
    justify-content:space-between;
    align-items:center;

}

.contador{

    background:var(--yellow);
    color:#000;

    min-width:45px;

    text-align:center;

    padding:6px 12px;

    border-radius:999px;
    font-weight:700;

}

table{

    width:100%;
    border-collapse:collapse;

}

td{

    padding:12px;

}

tr{

    border-bottom:
    1px solid var(--border);

}

td:last-child{

    text-align:right;
    font-weight:700;

}

.footer{

    text-align:center;
    color:var(--muted);
    margin-top:20px;

}

@media(max-width:900px){

    .grid-kpi{

        grid-template-columns:
        repeat(2,1fr);

    }

    .grid-duplo{

        grid-template-columns:
        1fr;

    }

}

</style>

</head>

<body>

<div class="container">

    <div class="card hero">

        <div class="logo">⚽</div>

        <h1>GD RIO DE MOURO</h1>

        <div id="jogo" class="jogo">
            A carregar...
        </div>

        <div id="dataHora"
             class="data"></div>

        <div id="estadio"
             class="estadio"></div>

    </div>

<div class="grid-kpi">

    <div class="card kpi">
        <div id="kpiCartoes"
             class="kpi-numero amarelo">0</div>
        <div class="kpi-label">🟨 Cartões</div>
    </div>

    <div class="card kpi">
        <div id="kpiCastigados"
             class="kpi-numero vermelho">0</div>
        <div class="kpi-label">🚫 Castigados</div>
    </div>

    <div class="card kpi">
        <div id="kpiRisco"
             class="kpi-numero azul">0</div>
        <div class="kpi-label">⚠️ Em Risco</div>
    </div>

    <div class="card kpi">
        <div id="kpiMultas"
             class="kpi-numero verde">0€</div>
        <div class="kpi-label">💰 Multas</div>
    </div>

</div>

<div class="grid-duplo">

    <div class="card">

        <div class="titulo">
            ⚔️ Adversários
        </div>

        <div id="adversario"></div>

        <div id="adversarioSeguinte"></div>

    </div>

    <div class="card">

        <div class="titulo">
            👨‍⚖️ Arbitragem
        </div>

        <div id="arbitro"></div>

        <div id="assistentes"></div>

    </div>

</div>

<div class="grid-duplo">

    <div class="card">

        <div class="titulo">
            🚫 Castigados
        </div>

        <div id="castigados"></div>

    </div>

    <div class="card">

        <div class="titulo">
            ⚠️ Jogadores em Risco
        </div>

        <div id="risco"></div>

    </div>

</div>

<div class="card">

    <div class="titulo">
        🟨 Ranking Disciplinar
    </div>

    <div id="listaCartoes"></div>

</div>

<div class="card">

    <div class="titulo">
        💰 Multas
    </div>

    <div id="listaMultas"></div>

</div>

<div class="card">

    <div class="titulo">
        📊 Estatísticas da Época
    </div>

    <div id="estatisticas"></div>

</div>

<div class="footer">

    Última atualização:
    <span id="atualizacao">-</span>

</div>

</div>

<script>

async function carregarDashboard(){

    try{

        const resposta =
        await fetch(
            "dashboard_data.json?t=" +
            Date.now()
        );

        const dados =
        await resposta.json();

        const s =
        dados.seniores;

        document.getElementById(
            "jogo"
        ).innerHTML =
        `
        ${s.proximo_jogo.casa}
        <br>
        VS
        <br>
        ${s.proximo_jogo.fora}
        `;

        document.getElementById(
            "dataHora"
        ).innerHTML =
        `${s.proximo_jogo.data} • ${s.proximo_jogo.hora}`;

        document.getElementById(
            "estadio"
        ).innerHTML =
        `📍 ${s.proximo_jogo.estadio}`;

        document.getElementById(
            "kpiCartoes"
        ).innerText =
        s.cartoes.total || 0;

        document.getElementById(
            "kpiCastigados"
        ).innerText =
        s.castigos.ativos || 0;

        document.getElementById(
            "kpiRisco"
        ).innerText =
        (s.cartoes.risco || []).length;

        document.getElementById(
            "kpiMultas"
        ).innerText =
        (s.multas.total || 0) + "€";

        document.getElementById(
            "adversario"
        ).innerHTML =
        `
        <div class="alerta">
            ⚔️ <strong>${s.proximo_adversario.nome}</strong>
        </div>
        `;

        document.getElementById(
            "adversarioSeguinte"
        ).innerHTML =
        `
        <div class="alerta">
            ⏭️ <strong>${s.adversario_semana_seguinte.nome}</strong>
        </div>
        `;

        document.getElementById(
            "arbitro"
        ).innerHTML =
        `
        <div class="alerta">
            👨‍⚖️ ${s.proximo_jogo.arbitro}
        </div>
        `;

        let assistentes = "";

        (s.proximo_jogo.assistentes || [])
        .forEach(a=>{

            assistentes += `
            <div class="alerta">
                🚩 ${a}
            </div>
            `;

        });

        document.getElementById(
            "assistentes"
        ).innerHTML =
        assistentes;

        document.getElementById(
            "atualizacao"
        ).innerText =
        dados.ultima_atualizacao;

    }
    catch(err){

        console.error(err);

    }

}

carregarDashboard();

setInterval(
    carregarDashboard,
    10000
);

</script>

</body>
</html>
