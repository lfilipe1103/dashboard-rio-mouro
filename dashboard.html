<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>GD Rio de Mouro • Dashboard</title>

<style>

:root{

    --bg:#050505;
    --card:#13213a;
    --card2:#223758;
    --border:#32496f;

    --gold:#ffd700;
    --green:#22c55e;
    --yellow:#facc15;
    --red:#ef4444;

}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:
    radial-gradient(
        circle at top,
        #12203a,
        #050505
    );

    color:white;

    font-family:
    "Segoe UI",
    Arial,
    sans-serif;

    padding:15px;

}

.container{

    max-width:900px;
    margin:auto;

}

.card{

    background:
    linear-gradient(
        180deg,
        #13213a,
        #1d2f4d
    );

    border:1px solid var(--border);

    border-radius:24px;

    padding:20px;

    margin-bottom:15px;

}

.titulo{

    font-size:22px;

    font-weight:800;

    margin-bottom:18px;

}

.hero{

    text-align:center;

}

.logo{

    width:90px;

    margin-bottom:15px;

}

.jogo{

    font-size:34px;

    font-weight:900;

    line-height:1.3;

}

.data{

    color:var(--gold);

    margin-top:15px;

    font-size:18px;

    font-weight:bold;

}

.local{

    margin-top:10px;

    color:#c4d0e0;

}

.alertas{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:12px;

}

.alerta{

    background:var(--card2);

    border-radius:16px;

    padding:18px;

    text-align:center;

}

.alerta-num{

    font-size:42px;

    font-weight:900;

}

.alerta-label{

    margin-top:10px;

}

.box{

    background:var(--card2);

    border-radius:12px;

    padding:14px;

    margin-bottom:10px;

}

.risco{

    background:var(--card2);

    border-radius:12px;

    padding:14px;

    margin-bottom:10px;

    display:flex;

    justify-content:space-between;

}

.linha{

    background:var(--card2);

    border-radius:12px;

    padding:14px;

    margin-bottom:10px;

    display:flex;

    justify-content:space-between;

}

.adversario{

    text-align:center;

}

.adversario-nome{

    font-size:36px;

    font-weight:900;

    margin-bottom:10px;

}

.grid-ficha{

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:10px;

}

.info{

    background:var(--card2);

    border-radius:12px;

    padding:12px;

    text-align:center;

}

.info-num{

    font-size:28px;

    font-weight:800;

}

.info-label{

    margin-top:5px;

    font-size:13px;

    color:#d0d9e7;

}

.voltar{

    width:100%;

    border:none;

    border-radius:18px;

    padding:18px;

    background:
    linear-gradient(
        135deg,
        #35589b,
        #4a78d1
    );

    color:white;

    font-size:18px;

    font-weight:700;

    cursor:pointer;

}

.footer{

    text-align:center;

    color:#9fb0c9;

    margin-top:15px;

}

@media(max-width:700px){

    .grid-ficha{

        grid-template-columns:
        1fr 1fr;

    }

    .jogo{

        font-size:28px;

    }

}

</style>

</head>

<body>

<div class="container">

    <!-- PRÓXIMO JOGO -->

    <div class="card hero">

        <img
            src="logo.png"
            class="logo"
            alt="Rio de Mouro">

        <div
            id="jogo"
            class="jogo">

            A carregar...

        </div>

        <div
            id="datajogo"
            class="data">

        </div>

        <div
            id="localjogo"
            class="local">

        </div>

    </div>

    <!-- ALERTAS -->

    <div class="card">

        <div class="titulo">

            🚨 Alertas da Semana

        </div>

        <div class="alertas">

            <div class="alerta">

                <div
                    id="numCastigados"
                    class="alerta-num"
                    style="color:#ef4444">

                    0

                </div>

                <div
                    class="alerta-label">

                    Castigados

                </div>

            </div>

            <div class="alerta">

                <div
                    id="numRisco"
                    class="alerta-num"
                    style="color:#facc15">

                    0

                </div>

                <div
                    class="alerta-label">

                    Em Risco

                </div>

            </div>

        </div>

    </div>

    <!-- ADVERSÁRIO -->

    <div class="card">

        <div class="titulo">

            ⚔️ Ficha do Adversário

        </div>

        <div
            class="adversario">

            <div
                id="nomeAdversario"
                class="adversario-nome">

                -

            </div>

        </div>

        <div class="grid-ficha">

            <div class="info">
                <div id="posicaoAdv" class="info-num">-</div>
                <div class="info-label">Posição</div>
            </div>

            <div class="info">
                <div id="pontosAdv" class="info-num">-</div>
                <div class="info-label">Pontos</div>
            </div>

            <div class="info">
                <div id="jogosAdv" class="info-num">-</div>
                <div class="info-label">Jogos</div>
            </div>

            <div class="info">
                <div id="gmAdv" class="info-num">-</div>
                <div class="info-label">GM</div>
            </div>

            <div class="info">
                <div id="gsAdv" class="info-num">-</div>
                <div class="info-label">GS</div>
            </div>

            <div class="info">
                <div id="dgAdv" class="info-num">-</div>
                <div class="info-label">DG</div>
            </div>

        </div>

    </div>

    <!-- RESULTADOS -->

    <div class="card">

        <div class="titulo">

            📅 Últimos Resultados do Adversário

        </div>

        <div
            id="ultimosResultados">

            A carregar...

        </div>

    </div>

    <!-- INDISPONIBILIDADE -->

    <div class="card">

        <div class="titulo">

            🚫 Indisponibilidade

        </div>

        <div id="indisponibilidade">

            A carregar...

        </div>

    </div>

    <!-- RISCO -->

    <div class="card">

        <div class="titulo">

            ⚠️ Jogadores em Risco

        </div>

        <div id="risco">

            A carregar...

        </div>

    </div>

    <!-- ARBITRAGEM -->

    <div class="card">

        <div class="titulo">

            👨‍⚖️ Arbitragem

        </div>

        <div id="arbitragem">

            A carregar...

        </div>

    </div>

    <!-- PROXIMO ADVERSÁRIO -->

    <div class="card">

        <div class="titulo">

            ⏭️ Próximo Adversário

        </div>

        <div
            style="text-align:center">

            <div
                id="dataProxAdv"
                class="data">

            </div>

            <div
                id="nomeProxAdv"
                class="adversario-nome">

            </div>

        </div>

    </div>

    <!-- VOLTAR -->

    <button
        class="voltar"
        onclick="
        location.href='index.html'
        ">

        ⬅️ Voltar

    </button>

    <div
        id="atualizacao"
        class="footer">

    </div>

</div>

<script>

async function carregar(){

    try{

        const r =
        await fetch(
            "dashboard_data.json?t="
            + Date.now()
        );

        const d =
        await r.json();

        const s =
        d.seniores || {};

        const adv =
        d.dashboard?.adversario || {};

        // JOGO

        document.getElementById(
            "jogo"
        ).innerHTML =

        `${s.proximo_jogo?.casa || "-"}
        <br>VS<br>
        ${s.proximo_jogo?.fora || "-"}`;

        document.getElementById(
            "datajogo"
        ).innerHTML =

        `📅 ${s.proximo_jogo?.data || "-"}
         • ${s.proximo_jogo?.hora || "-"}`;

        document.getElementById(
            "localjogo"
        ).innerHTML =

        `🏟️ ${s.proximo_jogo?.estadio || "-"}`;

        // ALERTAS

        document.getElementById(
            "numCastigados"
        ).innerText =

        s.castigos?.ativos || 0;

        document.getElementById(
            "numRisco"
        ).innerText =

        (s.cartoes?.risco || []).length;

        // ADVERSARIO

        document.getElementById(
            "nomeAdversario"
        ).innerText =
        adv.nome || "-";

        document.getElementById(
            "posicaoAdv"
        ).innerText =
        adv.posicao || "-";

        document.getElementById(
            "pontosAdv"
        ).innerText =
        adv.pontos || "-";

        document.getElementById(
            "jogosAdv"
        ).innerText =
        adv.jogos || "-";

        document.getElementById(
            "gmAdv"
        ).innerText =
        adv.gm || "-";

        document.getElementById(
            "gsAdv"
        ).innerText =
        adv.gs || "-";

        document.getElementById(
            "dgAdv"
        ).innerText =
        adv.dg || "-";

        // RESULTADOS

        let html = "";

        (
            adv.ultimos_resultados || []
        ).forEach(j => {

            let icon = "🟡";

            if(j.estado === "V")
                icon = "🟢";

            if(j.estado === "D")
                icon = "🔴";

            html += `
            <div class="box">
                ${icon}
                ${j.data}
                •
                ${j.texto}
            </div>
            `;

        });

        document.getElementById(
            "ultimosResultados"
        ).innerHTML =
        html || "Sem dados";

        // INDISPONIBILIDADE

        document.getElementById(
            "indisponibilidade"
        ).innerHTML =

        (s.castigos?.lista || [])
        .map(x => `
            <div class="box">
                🚫 ${x.nome}
            </div>
        `).join("")

        ||

        `<div class="box">
            ✅ Sem indisponíveis
        </div>`;

        // RISCO

        document.getElementById(
            "risco"
        ).innerHTML =

        (s.cartoes?.risco || [])
        .map(x => `
            <div class="risco">
                <span>
                    🟨 ${x.nome}
                </span>

                <strong>
                    ${x.cartoes}
                </strong>
            </div>
        `).join("")

        ||

        `<div class="box">
            ✅ Sem jogadores em risco
        </div>`;

        // ARBITRAGEM

        let arb = `
        <div class="linha">
            <span>Árbitro</span>
            <strong>
                ${s.proximo_jogo?.arbitro || "-"}
            </strong>
        </div>
        `;

        (
            s.proximo_jogo?.assistentes
            || []
        ).forEach(a => {

            arb += `
            <div class="linha">
                <span>Assistente</span>
                <strong>${a}</strong>
            </div>
            `;

        });

        document.getElementById(
            "arbitragem"
        ).innerHTML = arb;

        // PRÓXIMO ADVERSÁRIO

        document.getElementById(
            "dataProxAdv"
        ).innerText =

        s.adversario_risco?.data || "";

        document.getElementById(
            "nomeProxAdv"
        ).innerHTML =

        `⚔️ ${
            s.adversario_risco?.adversario
            || "-"
        }`;

        // RODAPÉ

        document.getElementById(
            "atualizacao"
        ).innerHTML =

        "Atualizado: "
        +
        (
            d.ultima_atualizacao
            || "-"
        );

    }

    catch(err){

        console.log(err);

    }

}

carregar();

</script>

</body>
</html>
