<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Dashboard Equipa</title>

<style>

body{
    background:#000;
    color:white;
    font-family:Segoe UI,Arial,sans-serif;
    padding:12px;
}

.container{
    max-width:1000px;
    margin:auto;
}

.card{
    background:#13213a;
    border-radius:20px;
    padding:20px;
    margin-bottom:12px;
}

.topo{
    text-align:center;
}

.logo{
    font-size:40px;
}

.jogo{
    font-size:28px;
    font-weight:700;
    line-height:1.3;
}

.data{
    color:#facc15;
    margin-top:10px;
}

.titulo{
    font-size:18px;
    font-weight:700;
    margin-bottom:12px;
}

.alerta{
    background:#1c2d4a;
    padding:12px;
    border-radius:12px;
    margin-bottom:8px;
}

.jogador{
    background:#1c2d4a;
    padding:12px;
    border-radius:12px;
    margin-bottom:8px;

    display:flex;

    justify-content:
    space-between;
}

.contador{

    background:#facc15;

    color:#000;

    border-radius:999px;

    padding:5px 12px;

    font-weight:700;

}

.kpi{

    font-size:32px;

    color:#22c55e;

    font-weight:700;

}

.footer{

    text-align:center;

    color:#9fb0c9;

}

</style>

</head>

<body>

<div class="container">

    <div class="card topo">

        <div class="logo">
            ⚽
        </div>

        <h1>
            GD RIO DE MOURO
        </h1>

        <div id="jogo"
             class="jogo">

            A carregar...

        </div>

        <div id="dataHora"
             class="data"></div>

    </div>

    <div class="card">

        <div class="titulo">
            👨‍⚖️ Arbitragem
        </div>

        <div id="arbitro"></div>

    </div>

    <div class="card">

        <div class="titulo">
            🚫 Castigados
        </div>

        <div id="castigados"></div>

    </div>

    <div class="card">

        <div class="titulo">
            ⚔️ Próximo Adversário
        </div>

        <div id="adversario"></div>

    </div>

    <div class="card">

        <div class="titulo">
            🟨 Total Cartões
        </div>

        <div id="kpiCartoes"
             class="kpi"></div>

    </div>

    <div class="card">

        <div class="titulo">
            🟨 Jogadores com Cartões
        </div>

        <div id="cartoes"></div>

    </div>

    <div class="card">

        <div class="titulo">
            💰 Multas
        </div>

        <div id="multas"></div>

    </div>

    <div class="card">

        <div class="titulo">
            📊 Estatísticas da Época
        </div>

        <div id="estatisticas">

            A carregar...

        </div>

    </div>

    <div class="footer">

        Última atualização:

        <span id="atualizacao"></span>

    </div>

</div>

<script>

async function carregarDashboard(){

    const resposta =
    await fetch(
        "dashboard_data.json?t=" +
        Date.now()
    );

    const dados =
    await resposta.json();

    const s =
    dados.seniores;

    document.getElementById(
        "jogo"
    ).innerHTML =
    `${s.proximo_jogo.casa}<br>VS<br>${s.proximo_jogo.fora}`;

    document.getElementById(
        "dataHora"
    ).innerText =
    `${s.proximo_jogo.data} | ${s.proximo_jogo.hora}`;

    document.getElementById(
        "arbitro"
    ).innerHTML =
    `
    ${s.proximo_jogo.arbitro}
    `;

    document.getElementById(
        "adversario"
    ).innerHTML =
    `
    ${s.proximo_adversario.nome}
    <br><br>

    Castigados:
    ${s.proximo_adversario.castigados}
    `;

    document.getElementById(
        "kpiCartoes"
    ).innerText =
    s.cartoes.total;

    document.getElementById(
        "castigados"
    ).innerHTML =
    (
        s.castigos.lista || []
    )
    .map(c => `
        <div class="alerta">
            ${c.nome}
        </div>
    `)
    .join("");

    document.getElementById(
        "cartoes"
    ).innerHTML =
    (
        s.cartoes.ranking || []
    )
    .map(j => `
        <div class="jogador">

            <div>
                ${j.nome}
            </div>

            <div class="contador">
                ${j.cartoes}
            </div>

        </div>
    `)
    .join("");

    document.getElementById(
        "multas"
    ).innerHTML =
    (
        s.multas.lista || []
    )
    .map(m => `
        <div class="alerta">

            ${m.nome}

            <br><br>

            ${Number(
                m.valor
            ).toFixed(2)} €

        </div>
    `)
    .join("");

    document.getElementById(
        "estatisticas"
    ).innerHTML =
    `
    Jogadores com cartões:
    ${s.cartoes.jogadores}
    `;

    document.getElementById(
        "atualizacao"
    ).innerText =
    dados.ultima_atualizacao;

}

carregarDashboard();

setInterval(
    carregarDashboard,
    10000
);

</script>

</body>

</html>
