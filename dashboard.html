<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>
    Dashboard Rio de Mouro
</title>

<style>

:root{

    --bg:#050505;

    --card:#13213a;

    --card2:#223758;

    --border:#32496f;

    --gold:#ffd700;

    --green:#22c55e;

    --yellow:#facc15;

    --red:#ef4444;

    --blue:#3b82f6;

}

*{

    margin:0;
    padding:0;

    box-sizing:border-box;

}

body{

    background:
    radial-gradient(
        circle at top,
        #12203a,
        #050505
    );

    color:white;

    font-family:
    "Segoe UI",
    Arial,
    sans-serif;

    padding:15px;

}

.container{

    max-width:900px;

    margin:auto;

}

.card{

    background:
    linear-gradient(
        180deg,
        #13213a,
        #1d2f4d
    );

    border:1px solid
    var(--border);

    border-radius:24px;

    padding:20px;

    margin-bottom:15px;

}

.logo{

    width:90px;

    margin-bottom:15px;

}

.hero{

    text-align:center;

}

.jogo{

    font-size:42px;

    font-weight:900;

    margin-bottom:10px;

}

.tipo-jogo{

    color:var(--gold);

    font-size:22px;

    font-weight:800;

    margin-bottom:10px;

}

.data{

    font-size:18px;

    color:#c4d0e0;

}

.titulo{

    font-size:22px;

    font-weight:800;

    margin-bottom:18px;

}

.alertas{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:15px;

}

.alerta{

    background:var(--card2);

    border-radius:18px;

    padding:20px;

    text-align:center;

}

.alerta-num{

    font-size:52px;

    font-weight:900;

}

.vermelho{

    color:#ef4444;

}

.amarelo{

    color:#facc15;

}

.box{

    background:var(--card2);

    border-radius:14px;

    padding:14px;

    margin-bottom:10px;

}

.linha{

    background:var(--card2);

    border-radius:14px;

    padding:14px;

    margin-bottom:10px;

    display:flex;

    justify-content:space-between;

}

.nome-adv{

    font-size:34px;

    font-weight:900;

    text-align:center;

    margin-bottom:15px;

}

.resumo-adv{

    text-align:center;

    line-height:1.8;

    font-size:18px;

}

.kpi-grid{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:10px;

    margin-top:15px;

}

.kpi-box{

    background:var(--card2);

    border-radius:14px;

    padding:14px;

    text-align:center;

}

.kpi-num{

    font-size:26px;

    font-weight:900;

    color:var(--gold);

}

.risco{

    background:var(--card2);

    border-radius:12px;

    padding:12px;

    margin-bottom:10px;

    display:flex;

    justify-content:space-between;

}

.resultado-v{

    border-left:5px solid
    var(--green);

}

.resultado-d{

    border-left:5px solid
    var(--red);

}

.resultado-e{

    border-left:5px solid
    var(--yellow);

}

.voltar{

    width:100%;

    border:none;

    border-radius:18px;

    padding:18px;

    background:
    linear-gradient(
        135deg,
        #35589b,
        #4a78d1
    );

    color:white;

    font-size:18px;

    font-weight:700;

    cursor:pointer;

}

.footer{

    text-align:center;

    color:#9fb0c9;

    margin-top:15px;

}

@media(max-width:800px){

    .alertas{

        grid-template-columns:1fr;

    }

    .kpi-grid{

        grid-template-columns:1fr;

    }

}

</style>

</head>

<body>

<div class="container">

<!-- ===================================== -->
<!-- PRÓXIMO JOGO -->
<!-- ===================================== -->

<div class="card hero">

    <img
        src="logo.png"
        class="logo">

    <div
        id="jogo"
        class="jogo">

        A carregar...

    </div>

    <div
        id="tipoJogo"
        class="tipo-jogo">

    </div>

    <div
        id="dataJogo"
        class="data">

    </div>

</div>

<!-- ===================================== -->
<!-- SITUAÇÃO EQUIPA -->
<!-- ===================================== -->

<div class="card">

    <div class="titulo">

        🚨 Situação da Equipa

    </div>

    <div class="alertas">

        <div class="alerta">

            <div
                id="numCastigados"
                class="alerta-num vermelho">

                0

            </div>

            <div>

                Castigados

            </div>

        </div>

        <div class="alerta">

            <div
                id="numRisco"
                class="alerta-num amarelo">

                0

            </div>

            <div>

                Em Risco

            </div>

        </div>

    </div>

</div>

      <!-- ===================================== -->
<!-- ARBITRAGEM -->
<!-- ===================================== -->

<div class="card">

    <div class="titulo">

        👨‍⚖️ Arbitragem

    </div>

    <div id="arbitragem">

    </div>

</div>

<!-- ===================================== -->
<!-- ANÁLISE ADVERSÁRIO -->
<!-- ===================================== -->

<div class="card">

    <div class="titulo">

        ⚔️ Análise do Adversário

    </div>

    <div
        id="nomeAdversario"
        class="nome-adv">

        -

    </div>

    <div
        id="resumoAdversario">

    </div>

</div>

<!-- ===================================== -->
<!-- ÚLTIMOS RESULTADOS -->
<!-- ===================================== -->

<div class="card">

    <div class="titulo">

        📅 Últimos Resultados

    </div>

    <div
        id="ultimosResultados">

    </div>

</div>

<!-- ===================================== -->
<!-- CASTIGADOS -->
<!-- ===================================== -->

<div class="card">

    <div class="titulo">

        🚫 Castigados

    </div>

    <div
        id="castigados">

    </div>

</div>

<!-- ===================================== -->
<!-- JOGADORES EM RISCO -->
<!-- ===================================== -->

<div class="card">

    <div class="titulo">

        🟨 Jogadores em Risco

    </div>

    <div
        id="risco">

    </div>

</div>

<style>

.kpi-grid{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:12px;

}

.kpi-box{

    background:var(--card2);

    border-radius:14px;

    padding:15px;

    text-align:center;

}

.kpi-num{

    font-size:26px;

    font-weight:900;

    color:var(--gold);

}

.resultado-v{

    border-left:
    5px solid #22c55e;

}

.resultado-d{

    border-left:
    5px solid #ef4444;

}

.resultado-e{

    border-left:
    5px solid #facc15;

}

</style>

      <!-- ===================================== -->
<!-- PRÓXIMA JORNADA -->
<!-- ===================================== -->

<div class="card">

    <div class="titulo">

        ⏭️ Próxima Jornada

    </div>

    <div
        id="proximaJornada"
        class="ficha-adv">

    </div>

</div>

<!-- ===================================== -->
<!-- VOLTAR -->
<!-- ===================================== -->

<button
    class="voltar"
    onclick="
        location.href='index.html'
    ">

    ⬅️ Voltar

</button>

<div
    id="atualizacao"
    class="footer">

</div>

</div>

<script>

async function carregar(){

    const r = await fetch(
        "dashboard_data.json?t="
        + Date.now()
    );

    const d =
    await r.json();

    const s =
    d.seniores || {};

    const adv =
    d.dashboard?.adversario || {};

    /* ==========================
       PRÓXIMO JOGO
    ========================== */

    const adversario =

        s.proximo_adversario?.nome
        || "-";

    const local =

        s.proximo_jogo?.casa
        ?.toUpperCase()
        .includes("RIO DE MOURO")

        ? "CASA"

        : "FORA";

    document.getElementById(
        "jogo"
    ).innerHTML =

    adversario;

    document.getElementById(
        "tipoJogo"
    ).innerHTML =

    local;

    document.getElementById(
        "dataJogo"
    ).innerHTML =

    `
    ${s.proximo_jogo?.data || "-"}
    •
    ${s.proximo_jogo?.hora || "-"}
    `;

    /* ==========================
       ALERTAS
    ========================== */

    document.getElementById(
        "numCastigados"
    ).innerText =

    s.castigos?.ativos || 0;

    document.getElementById(
        "numRisco"
    ).innerText =

    (
        s.cartoes?.risco || []
    ).length;

    /* ==========================
       ADVERSÁRIO
    ========================== */

    document.getElementById(
        "nomeAdversario"
    ).innerText =

    adv.nome || "-";

    document.getElementById(
        "resumoAdversario"
    ).innerHTML =

    `
    <div class="kpi-grid">

        <div class="kpi-box">

            <div class="kpi-num">
                ${adv.posicao || "-"}
            </div>

            <div>Posição</div>

        </div>

        <div class="kpi-box">

            <div class="kpi-num">
                ${adv.pontos || "-"}
            </div>

            <div>Pontos</div>

        </div>

        <div class="kpi-box">

            <div class="kpi-num">
                ${adv.vitorias || 0}
            </div>

            <div>Vitórias</div>

        </div>

        <div class="kpi-box">

            <div class="kpi-num">
                ${adv.empates || 0}
            </div>

            <div>Empates</div>

        </div>

        <div class="kpi-box">

            <div class="kpi-num">
                ${adv.derrotas || 0}
            </div>

            <div>Derrotas</div>

        </div>

        <div class="kpi-box">

            <div class="kpi-num">
                ${adv.dg || "-"}
            </div>

            <div>DG</div>

        </div>

    </div>
    `;

    /* ==========================
       RESULTADOS ADVERSÁRIO
    ========================== */

    let resultados = "";

    (
        adv.ultimos_resultados || []
    ).forEach(j => {

        let classe =
        "resultado-e";

        if(
            j.estado === "V"
        ) classe =
        "resultado-v";

        if(
            j.estado === "D"
        ) classe =
        "resultado-d";

        resultados += `

        <div
            class="box ${classe}">

            ${j.texto}

        </div>

        `;

    });

    document.getElementById(
        "ultimosResultados"
    ).innerHTML =
    resultados;

    /* ==========================
       CASTIGADOS
    ========================== */

    let cast = `

    <div class="box">

        <strong>
        Rio de Mouro
        </strong>

        <br><br>

    `;

    if(
        (s.castigos?.lista || [])
        .length === 0
    ){

        cast +=
        "✅ Sem castigados";

    }
    else{

        s.castigos.lista.forEach(x=>{

            cast += `
            🚫 ${x.nome}<br>
            `;

        });

    }

    cast += `
    </div>

    <div class="box">

        <strong>
        ${adv.nome || "Adversário"}
        </strong>

        <br><br>

        🚫 ${
            s.proximo_adversario?.castigados || 0
        } castigados

    </div>
    `;

    document.getElementById(
        "castigados"
    ).innerHTML =
    cast;

    /* ==========================
       RISCO
    ========================== */

    let risco = "";

    (
        s.cartoes?.risco || []
    ).forEach(x => {

        risco += `

        <div class="risco">

            <span>
                ${x.nome}
            </span>

            <strong>
                ${x.cartoes}
            </strong>

        </div>

        `;

    });

    document.getElementById(
        "risco"
    ).innerHTML =
    risco;

    /* ==========================
       ARBITRAGEM
    ========================== */

    let arb = `

    <div class="linha">

        <span>

            Árbitro

        </span>

        <strong>

            ${
                s.proximo_jogo?.arbitro || "-"
            }

        </strong>

    </div>

    `;

    (
        s.proximo_jogo?.assistentes || []
    ).forEach(a => {

        arb += `

        <div class="linha">

            <span>

                Assistente

            </span>

            <strong>

                ${a}

            </strong>

        </div>

        `;

    });

    document.getElementById(
        "arbitragem"
    ).innerHTML =
    arb;

    /* ==========================
       PRÓXIMA JORNADA
    ========================== */

    const prox =
    s.proxima_jornada || {};

    const proxAdv =

        prox.casa
        ?.toUpperCase()
        .includes("RIO DE MOURO")

        ? prox.fora

        : prox.casa;

    const proxLocal =

        prox.casa
        ?.toUpperCase()
        .includes("RIO DE MOURO")

        ? "CASA"

        : "FORA";

    document.getElementById(
        "proximaJornada"
    ).innerHTML =

    `
    <div class="nome-adv">

        ${proxAdv || "-"}

    </div>

    <div class="data">

        ${proxLocal}

    </div>

    <br>

    <div>

        ${prox.data || "-"}
        •
        ${prox.hora || "-"}

    </div>
    `;

    /* ==========================
       DATA
    ========================== */

    document.getElementById(
        "atualizacao"
    ).innerHTML =

    "Atualizado: "
    +
    d.ultima_atualizacao;

}

carregar();

</script>

</body>

</html>
