<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rio de Mouro | Competição</title>

<style>

:root{
    --bg:#0f172a;
    --card:#1e293b;
    --card2:#334155;
    --blue:#2563eb;
    --blue2:#1d4ed8;
    --green:#22c55e;
    --yellow:#f59e0b;
    --red:#ef4444;
    --text:#f8fafc;
    --muted:#94a3b8;
    --border:rgba(255,255,255,.08);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:'Segoe UI',sans-serif;
}

.container{
    max-width:1700px;
    margin:auto;
    padding:20px;
}

.header{
    background:linear-gradient(
        135deg,
        #1d4ed8,
        #2563eb
    );

    border-radius:20px;
    padding:30px;
    margin-bottom:20px;
}

.header h1{
    font-size:2.2rem;
}

.header p{
    margin-top:8px;
    color:#dbeafe;
}

.stats-grid{
    margin-top:20px;

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(180px,1fr));

    gap:15px;
}

.stat-card{
    background:rgba(255,255,255,.1);
    backdrop-filter:blur(10px);
    padding:20px;
    border-radius:15px;
}

.stat-card span{
    color:#dbeafe;
    display:block;
}

.stat-card h2{
    margin-top:8px;
    font-size:2rem;
}

.main-grid{
    display:grid;
    grid-template-columns:380px 1fr;
    gap:20px;
}

.card{
    background:var(--card);

    border-radius:20px;

    padding:20px;

    margin-bottom:20px;

    box-shadow:0 8px 25px rgba(0,0,0,.25);
}

.card-title{
    color:#60a5fa;
    font-size:1.2rem;
    margin-bottom:15px;
    font-weight:700;
}

/* CLASSIFICAÇÃO */

table{
    width:100%;
    border-collapse:collapse;
}

th{
    padding:12px;
    text-align:left;
    border-bottom:1px solid var(--border);
}

td{
    padding:12px;
    border-bottom:1px solid var(--border);
}

.rdm-row{
    background:#1d4ed8;
    font-weight:700;
}

/* PROXIMO JOGO */

.proximo-jogo{

    background:
    linear-gradient(
    135deg,
    #1e3a8a,
    #2563eb
    );

    border-radius:20px;

    padding:35px;

    text-align:center;

}

.proximo-label{
    color:#bfdbfe;
    text-transform:uppercase;
    letter-spacing:2px;
}

.equipa-home,
.equipa-away{
    font-size:2rem;
    font-weight:700;
}

.vs{
    font-size:1.5rem;
    margin:20px 0;
    color:#bfdbfe;
}

.info-jogo{
    margin-top:20px;
    color:#dbeafe;
}

</style>
</head>

<body>

<div class="container">

    <div class="header">

        <h1>⚽ Rio de Mouro Competition Hub</h1>

        <p>
            Classificação • Próxima Jornada • Análise do Adversário
        </p>

        <div class="stats-grid">

            <div class="stat-card">
                <span>Posição</span>
                <h2 id="posicaoLiga">-</h2>
            </div>

            <div class="stat-card">
                <span>Pontos</span>
                <h2 id="pontosLiga">-</h2>
            </div>

            <div class="stat-card">
                <span>Dif. Golos</span>
                <h2 id="difGolos">-</h2>
            </div>

            <div class="stat-card">
                <span>Próximo Adversário</span>
                <h2 id="adversarioLiga">-</h2>
            </div>

        </div>

    </div>

    <div class="main-grid">

        <div>

            <div class="card">

                <div class="card-title">
                    🏆 Classificação
                </div>

                <table>

                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Equipa</th>
                            <th>Pts</th>
                        </tr>
                    </thead>

                    <tbody id="classificacao"></tbody>

                </table>

            </div>

            <div class="card">

                <div class="card-title">
                    🎯 Jogadores a Vigiar
                </div>

                <div id="jogadores-chave"></div>

            </div>

        </div>

        <div>

            <div id="proximo-jogo"></div>

            <div class="card">

                <div class="card-title">
                    📅 Próxima Jornada
                </div>

                <div
                    id="jornada-grid"
                    style="
                    display:grid;
                    grid-template-columns:
                    repeat(auto-fill,minmax(280px,1fr));
                    gap:15px;
                    ">
                </div>

            </div>

            <div class="card">

                <div class="card-title">
                    ⚔️ Comparação
                </div>

                <div id="comparacao"></div>

            </div>

            <div class="card">

                <div class="card-title">
                    🟨 Alerta Disciplinar
                </div>

                <div id="disciplinar"></div>

            </div>

        </div>

    </div>

</div>

    <script>

async function iniciar(){

    const jornada =
        await fetch("jornada.json")
        .then(r=>r.json());

    const dashboard =
        await fetch("dashboard_data.json")
        .then(r=>r.json());

    const jogadores =
        await fetch("jogadores.json")
        .then(r=>r.json());

    const adversario =
        await fetch("adversario_jogadores.json")
        .then(r=>r.json());

    const classificacao =
        dashboard.classificacao;

    const rdm =
        classificacao.find(
        x=>x.rio_mouro
        );

    document.getElementById(
    "posicaoLiga").textContent =
    rdm.pos+"º";

    document.getElementById(
    "pontosLiga").textContent =
    rdm.pts;

    document.getElementById(
    "difGolos").textContent =
    rdm.dg > 0
    ? "+"+rdm.dg
    : rdm.dg;

    document.getElementById(
    "adversarioLiga").textContent =
    "RD Algueirão";

    document.getElementById(
    "classificacao").innerHTML =

    classificacao.map(t=>`

        <tr class="
        ${t.rio_mouro ?
        'rdm-row' : ''}
        ">

            <td>${t.pos}</td>
            <td>${t.equipa}</td>
            <td>${t.pts}</td>

        </tr>

    `).join('');

    const jogoRDM =
        jornada.jogos.find(j=>

        j.casa==="Rio de Mouro" ||
        j.fora==="Rio de Mouro"

        );

    document.getElementById(
    "proximo-jogo").innerHTML =

    `
    <div class="proximo-jogo">

        <div class="proximo-label">
            Próximo Jogo
        </div>

        <div
        class="equipa-home"
        style="margin-top:20px">

        ${jogoRDM.casa}

        </div>

        <div class="vs">VS</div>

        <div class="equipa-away">

        ${jogoRDM.fora}

        </div>

        <div class="info-jogo">

        🕒 ${jogoRDM.hora}

        </div>

    </div>
    `;

    document.getElementById(
    "jornada-grid").innerHTML =

    jornada.jogos.map(jogo=>{

        const rdm =

            jogo.casa==="Rio de Mouro" ||
            jogo.fora==="Rio de Mouro";

        return `

        <div style="
            background:
            ${rdm ? '#1d4ed8' : '#162235'};
            border-radius:15px;
            padding:15px;
        ">

            <div>${jogo.casa}</div>

            <div style="
            margin:10px 0;
            color:#94a3b8;
            ">
            VS
            </div>

            <div>${jogo.fora}</div>

            <div style="
            margin-top:10px;
            color:#60a5fa;
            ">
            ${jogo.hora}
            </div>

        </div>

        `;

    }).join('');

    document.getElementById(
    "comparacao").innerHTML =

    `
    <table>

    <tr>
        <th>Métrica</th>
        <th>RDM</th>
        <th>RDA</th>
    </tr>

    <tr>
        <td>Posição</td>
        <td>3</td>
        <td>8</td>
    </tr>

    <tr>
        <td>Pontos</td>
        <td>16</td>
        <td>9</td>
    </tr>

    </table>
    `;

}

iniciar();

</script>

</body>
</html>
