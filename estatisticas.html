<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>

    Estatísticas Rio de Mouro

</title>

<style>

:root{

    --bg:#050505;
    --card:#13213a;
    --card2:#223758;
    --border:#32496f;

    --gold:#ffd700;
    --green:#22c55e;
    --yellow:#facc15;
    --red:#ef4444;

}

*{

    margin:0;
    padding:0;

    box-sizing:border-box;

}

body{

    background:
    radial-gradient(
        circle at top,
        #12203a,
        #050505
    );

    color:white;

    font-family:
    "Segoe UI",
    Arial,
    sans-serif;

    padding:15px;

}

.container{

    max-width:900px;
    margin:auto;

}

.card{

    background:
    linear-gradient(
        180deg,
        #13213a,
        #1c2d4a
    );

    border:1px solid
    var(--border);

    border-radius:24px;

    padding:20px;

    margin-bottom:15px;

}

.logo{

    width:90px;

    margin-bottom:15px;

}

.hero{

    text-align:center;

}

.hero-posicao{

    font-size:70px;

    font-weight:900;

    color:var(--gold);

    line-height:1;

}

.hero-pontos{

    margin-top:10px;

    font-size:24px;

    font-weight:700;

}

.titulo{

    text-align:center;

    font-size:24px;

    font-weight:900;

    margin-bottom:20px;

}

.grid{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:12px;

}

.kpi{

    background:var(--card2);

    border-radius:16px;

    padding:18px;

    text-align:center;

}

.kpi-num{

    font-size:42px;

    font-weight:900;

}

.kpi-label{

    margin-top:8px;

    color:#c4d0e0;

}

.verde{

    color:var(--green);

}

.amarelo{

    color:var(--gold);

}

.vermelho{

    color:var(--red);

}

.forma{

    display:flex;

    justify-content:center;

    gap:15px;

    flex-wrap:wrap;

}

.forma-item{

    text-align:center;

}

.forma-bola{

    font-size:34px;

}

.linha{

    display:flex;

    justify-content:space-between;

    align-items:center;

    background:var(--card2);

    border-radius:12px;

    padding:12px;

    margin-bottom:10px;

}

.rdm{

    background:
    linear-gradient(
        135deg,
        #8a5c00,
        #d49a00
    ) !important;

}

.botao{

    width:100%;

    border:none;

    border-radius:18px;

    padding:18px;

    background:
    linear-gradient(
        135deg,
        #35589b,
        #4a78d1
    );

    color:white;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

}

.atualizacao{

    text-align:center;

    color:#9fb0c9;

    font-size:13px;

}

@media(max-width:800px){

    .grid{

        grid-template-columns:1fr;

    }

}

</style>

</head>

<body>

<div class="container">

<!-- HERO -->

<div class="card hero">

    <img
        src="logo.png"
        class="logo">

    <div
        id="heroPosicao"
        class="hero-posicao">

        -

    </div>

    <div
        id="heroPontos"
        class="hero-pontos">

        -

    </div>

</div>

<!-- RESUMO DA ÉPOCA -->

<div class="card">

    <div class="titulo">

        🏆 Resumo da Época

    </div>

    <div class="grid">

        <div class="kpi">

            <div
                id="jogos"
                class="kpi-num">

                0

            </div>

            <div class="kpi-label">

                Jogos

            </div>

        </div>

        <div class="kpi">

            <div
                id="pontos"
                class="kpi-num amarelo">

                0

            </div>

            <div class="kpi-label">

                Pontos

            </div>

        </div>

        <div class="kpi">

            <div
                id="vitorias"
                class="kpi-num verde">

                0

            </div>

            <div class="kpi-label">

                Vitórias

            </div>

        </div>

        <div class="kpi">

            <div
                id="empates"
                class="kpi-num amarelo">

                0

            </div>

            <div class="kpi-label">

                Empates

            </div>

        </div>

        <div class="kpi">

            <div
                id="derrotas"
                class="kpi-num vermelho">

                0

            </div>

            <div class="kpi-label">

                Derrotas

            </div>

        </div>

        <div class="kpi">

            <div
                id="dg"
                class="kpi-num">

                0

            </div>

            <div class="kpi-label">

                Diferença Golos

            </div>

        </div>

    </div>

</div>

    <!-- ===================================== -->
<!-- FORMA -->
<!-- ===================================== -->

<div class="card">

    <div class="titulo">

        🔥 Forma Atual

    </div>

    <div
        id="forma"
        class="forma">

    </div>

</div>

<!-- ===================================== -->
<!-- GOLOS -->
<!-- ===================================== -->

<div class="card">

    <div class="titulo">

        ⚽ Golos

    </div>

    <div class="grid">

        <div class="kpi">

            <div
                id="gm"
                class="kpi-num verde">

                0

            </div>

            <div class="kpi-label">

                Marcados

            </div>

        </div>

        <div class="kpi">

            <div
                id="gs"
                class="kpi-num vermelho">

                0

            </div>

            <div class="kpi-label">

                Sofridos

            </div>

        </div>

        <div class="kpi">

            <div
                id="mediaGM"
                class="kpi-num">

                0

            </div>

            <div class="kpi-label">

                Média GM

            </div>

        </div>

        <div class="kpi">

            <div
                id="mediaGS"
                class="kpi-num">

                0

            </div>

            <div class="kpi-label">

                Média GS

            </div>

        </div>

    </div>

</div>

<!-- ===================================== -->
<!-- LUTA PELA SUBIDA -->
<!-- ===================================== -->

<div class="card">

    <div class="titulo">

        📈 Luta pela Subida

    </div>

    <div
        id="subida">

    </div>

</div>

<!-- ===================================== -->
<!-- CLASSIFICAÇÃO -->
<!-- ===================================== -->

<div class="card">

    <div class="titulo">

        🏆 Classificação

    </div>

    <div
        id="classificacao">

    </div>

</div>

<style>

.forma{

    display:flex;

    justify-content:center;

    gap:18px;

    flex-wrap:wrap;

}

.forma-item{

    text-align:center;

}

.forma-bola{

    font-size:38px;

}

.linha{

    display:flex;

    justify-content:space-between;

    align-items:center;

    background:var(--card2);

    border-radius:12px;

    padding:14px;

    margin-bottom:10px;

}

.rdm{

    background:
    linear-gradient(
        135deg,
        #8a5c00,
        #d49a00
    ) !important;

    color:white;

    font-weight:700;

}

</style>

    <!-- ===================================== -->
<!-- PRÓXIMA JORNADA -->
<!-- ===================================== -->

<div class="card">

    <div class="titulo">

        ⏭️ Próxima Jornada

    </div>

    <div
        id="proximaJornada"
        class="hero">

    </div>

</div>

<!-- ===================================== -->
<!-- VOLTAR -->
<!-- ===================================== -->

<div class="card">

    <button
        class="botao"
        onclick="
            location.href='index.html'
        ">

        ⬅️ Voltar

    </button>

</div>

<div
    id="atualizacao"
    class="atualizacao">

</div>

</div>

<script>

async function carregarDados(){

    try{

        const resp =
        await fetch(
            "./dashboard_data.json?t="
            + Date.now()
        );

        const data =
        await resp.json();

        const r =
        data.resumo_epoca || {};

        const forma =
        data.forma || [];

        const classificacao =
        data.classificacao || [];

        const contexto =
        data.contexto_classificacao || {};

        const s =
        data.seniores || {};

        /* =====================
           HERO
        ===================== */

        document.getElementById(
            "heroPosicao"
        ).innerText =

        r.posicao
        ? `${r.posicao}º`
        : "-";

        document.getElementById(
            "heroPontos"
        ).innerText =

        `${r.pontos || 0} Pontos`;

        /* =====================
           RESUMO
        ===================== */

        document.getElementById(
            "jogos"
        ).innerText =
        r.j || 0;

        document.getElementById(
            "pontos"
        ).innerText =
        r.pontos || 0;

        document.getElementById(
            "vitorias"
        ).innerText =
        r.v || 0;

        document.getElementById(
            "empates"
        ).innerText =
        r.e || 0;

        document.getElementById(
            "derrotas"
        ).innerText =
        r.d || 0;

        document.getElementById(
            "dg"
        ).innerText =
        r.dg || "-";

        /* =====================
           FORMA
        ===================== */

        const simbolos = {

            V:"🟢",

            E:"🟡",

            D:"🔴"

        };

        let formaHtml = "";

        forma.forEach(x=>{

            formaHtml += `

            <div class="forma-item">

                <div class="forma-bola">

                    ${simbolos[x] || "⚪"}

                </div>

                <div>

                    ${x}

                </div>

            </div>

            `;

        });

        document.getElementById(
            "forma"
        ).innerHTML =
        formaHtml;

        /* =====================
           GOLOS
        ===================== */

        document.getElementById(
            "gm"
        ).innerText =
        r.gm || 0;

        document.getElementById(
            "gs"
        ).innerText =
        r.gs || 0;

        document.getElementById(
            "mediaGM"
        ).innerText =

        r.j
        ? (r.gm / r.j)
            .toFixed(2)
        : "0";

        document.getElementById(
            "mediaGS"
        ).innerText =

        r.j
        ? (r.gs / r.j)
            .toFixed(2)
        : "0";

        /* =====================
           LUTA PELA SUBIDA
        ===================== */

        let subida = "";

        (contexto.top2 || [])
        .forEach(eq=>{

            subida += `

            <div class="linha">

                <div>

                    ${eq.pos}º
                    -
                    ${eq.equipa}

                </div>

                <div>

                    ${eq.pts} pts

                </div>

            </div>

            `;

        });

        if(contexto.rio_mouro){

            subida += `

            <div class="linha rdm">

                <div>

                    ${contexto.rio_mouro.pos}º
                    -
                    ${contexto.rio_mouro.equipa}

                </div>

                <div>

                    ${contexto.rio_mouro.pts} pts

                </div>

            </div>

            `;

        }

        document.getElementById(
            "subida"
        ).innerHTML =
        subida;

        /* =====================
           CLASSIFICAÇÃO
        ===================== */

        let htmlClass = "";

        classificacao.forEach(eq=>{

            htmlClass += `

            <div class="
                linha
                ${eq.rio_mouro ? 'rdm' : ''}
            ">

                <div>

                    ${eq.pos}º
                    -
                    ${eq.equipa}

                </div>

                <div>

                    ${eq.pts} pts

                </div>

            </div>

            `;

        });

        document.getElementById(
            "classificacao"
        ).innerHTML =
        htmlClass;

        /* =====================
           PRÓXIMA JORNADA
        ===================== */

        const prox =
        s.proxima_jornada || {};

        const adversario =

            prox.casa
            ?.toUpperCase()
            .includes(
                "RIO DE MOURO"
            )

            ? prox.fora

            : prox.casa;

        const local =

            prox.casa
            ?.toUpperCase()
            .includes(
                "RIO DE MOURO"
            )

            ? "CASA"

            : "FORA";

        document.getElementById(
            "proximaJornada"
        ).innerHTML =

        `
        <div
            class="hero-posicao"
            style="
            font-size:28px">

            ${adversario || "-"}

        </div>

        <div
            class="hero-pontos">

            ${local}

        </div>

        <div
            class="data">

            ${prox.data || "-"}
            •
            ${prox.hora || "-"}

        </div>
        `;

        /* =====================
           RODAPÉ
        ===================== */

        document.getElementById(
            "atualizacao"
        ).innerHTML =

        "Atualizado: "
        +
        (
            data.ultima_atualizacao
            || "-"
        );

    }
    catch(err){

        console.error(err);

    }

}

carregarDados();

</script>

</body>

</html>
