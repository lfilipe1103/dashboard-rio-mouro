<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>
    Estatísticas Rio de Mouro
</title>

<style>

:root{

    --bg:#050505;

    --card:#13213a;

    --card2:#223758;

    --border:#32496f;

    --gold:#ffd700;

    --green:#22c55e;

    --yellow:#facc15;

    --red:#ef4444;

}

*{

    margin:0;
    padding:0;

    box-sizing:border-box;

}

body{

    background:
    radial-gradient(
        circle at top,
        #12203a,
        #050505
    );

    color:white;

    font-family:
    "Segoe UI",
    Arial,
    sans-serif;

    padding:15px;

}

.container{

    max-width:900px;

    margin:auto;

}

.card{

    background:
    linear-gradient(
        180deg,
        #13213a,
        #1c2d4a
    );

    border:1px solid
    var(--border);

    border-radius:24px;

    padding:20px;

    margin-bottom:15px;

}

.logo{

    width:90px;

    margin-bottom:15px;

}

.hero{

    text-align:center;

}

.hero-posicao{

    font-size:60px;

    font-weight:900;

    color:var(--gold);

}

.hero-pontos{

    font-size:24px;

    font-weight:700;

    margin-top:10px;

}

.titulo{

    font-size:24px;

    font-weight:900;

    margin-bottom:18px;

    text-align:center;

}

.grid{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:12px;

}

.kpi{

    background:var(--card2);

    border-radius:16px;

    padding:18px;

    text-align:center;

}

.kpi-num{

    font-size:42px;

    font-weight:900;

}

.kpi-label{

    margin-top:8px;

    color:#c4d0e0;

}

.verde{

    color:var(--green);

}

.amarelo{

    color:var(--gold);

}

.vermelho{

    color:var(--red);

}

@media(max-width:800px){

    .grid{

        grid-template-columns:1fr;

    }

}

</style>

</head>

<body>

<div class="container">

<!-- ===================================== -->
<!-- HERO -->
<!-- ===================================== -->

<div class="card hero">

    <img
        src="logo.png"
        class="logo">

    <div
        id="heroPosicao"
        class="hero-posicao">

        -

    </div>

    <div
        id="heroPontos"
        class="hero-pontos">

        -

    </div>

</div>

<!-- ===================================== -->
<!-- RESUMO -->
<!-- ===================================== -->

<div class="card">

    <div class="titulo">

        🏆 Resumo da Época

    </div>

    <div class="grid">

        <div class="kpi">

            <div
                id="jogos"
                class="kpi-num">

                0

            </div>

            <div class="kpi-label">

                Jogos

            </div>

        </div>

        <div class="kpi">

            <div
                id="pontos"
                class="kpi-num amarelo">

                0

            </div>

            <div class="kpi-label">

                Pontos

            </div>

        </div>

        <div class="kpi">

            <div
                id="vitorias"
                class="kpi-num verde">

                0

            </div>

            <div class="kpi-label">

                Vitórias

            </div>

        </div>

        <div class="kpi">

            <div
                id="empates"
                class="kpi-num amarelo">

                0

            </div>

            <div class="kpi-label">

                Empates

            </div>

        </div>

        <div class="kpi">

            <div
                id="derrotas"
                class="kpi-num vermelho">

                0

            </div>

            <div class="kpi-label">

                Derrotas

            </div>

        </div>

        <div class="kpi">

            <div
                id="dg"
                class="kpi-num">

                0

            </div>

            <div class="kpi-label">

                DG

            </div>

        </div>

    </div>

</div>
<!-- ===================================== -->
<!-- FORMA -->
<!-- ===================================== -->

<div class="card">

    <div class="titulo">

        🔥 Forma Atual

    </div>

    <div
        id="forma"
        class="forma">

    </div>

</div>

<!-- ===================================== -->
<!-- INDICADORES -->
<!-- ===================================== -->

<div class="card">

    <div class="titulo">

        📈 Indicadores

    </div>

    <div class="grid">

        <div class="kpi">

            <div
                id="semPerder"
                class="kpi-num">

                0

            </div>

            <div class="kpi-label">

                Sem Perder

            </div>

        </div>

        <div class="kpi">

            <div
                id="aVencer"
                class="kpi-num">

                0

            </div>

            <div class="kpi-label">

                A Vencer

            </div>

        </div>

        <div class="kpi">

            <div
                id="aMarcar"
                class="kpi-num">

                0

            </div>

            <div class="kpi-label">

                A Marcar

            </div>

        </div>

        <div class="kpi">

            <div
                id="aSofrer"
                class="kpi-num">

                0

            </div>

            <div class="kpi-label">

                A Sofrer

            </div>

        </div>

    </div>

</div>

<!-- ===================================== -->
<!-- GOLOS -->
<!-- ===================================== -->

<div class="card">

    <div class="titulo">

        ⚽ Golos

    </div>

    <div class="grid">

        <div class="kpi">

            <div
                id="gm"
                class="kpi-num verde">

                0

            </div>

            <div class="kpi-label">

                Marcados

            </div>

        </div>

        <div class="kpi">

            <div
                id="gs"
                class="kpi-num vermelho">

                0

            </div>

            <div class="kpi-label">

                Sofridos

            </div>

        </div>

        <div class="kpi">

            <div
                id="mediaGM"
                class="kpi-num">

                0

            </div>

            <div class="kpi-label">

                Média GM

            </div>

        </div>

        <div class="kpi">

            <div
                id="mediaGS"
                class="kpi-num">

                0

            </div>

            <div class="kpi-label">

                Média GS

            </div>

        </div>

    </div>

</div>

<!-- ===================================== -->
<!-- CLASSIFICAÇÃO -->
<!-- ===================================== -->

<div class="card">

    <div class="titulo">

        🏆 Classificação

    </div>

    <div
        id="classificacao">

    </div>

</div>

<style>

.forma{

    display:flex;

    justify-content:center;

    gap:15px;

    flex-wrap:wrap;

}

.forma-item{

    text-align:center;

}

.forma-bola{

    font-size:34px;

}

.rdm{

    background:
    linear-gradient(
        135deg,
        #8a5c00,
        #d49a00
    ) !important;

}

</style>

      <!-- ===================================== -->
<!-- PRÓXIMA JORNADA -->
<!-- ===================================== -->

<div class="card">

    <div class="titulo">

        ⏭️ Próxima Jornada

    </div>

    <div
        id="proximaJornada"
        class="nome-adv">

    </div>

</div>

<!-- ===================================== -->
<!-- VOLTAR -->
<!-- ===================================== -->

<button
    class="voltar"
    onclick="
        location.href='index.html'
    ">

    ⬅️ Voltar

</button>

<div
    id="atualizacao"
    class="footer">

</div>

</div>

<script>

async function carregarDados(){

    const resp =
    await fetch(
        "./dashboard_data.json?t="
        + Date.now()
    );

    const data =
    await resp.json();

    const s =
    data.seniores || {};

    const adv =
    data.dashboard?.adversario || {};

    const r =
    data.resumo_epoca || {};

    const forma =
    data.forma || [];

    /* =====================
       CABEÇALHO
    ===================== */

    const adversario =

        s.proximo_adversario?.nome
        || "-";

    const local =

        s.proximo_jogo?.casa
        ?.toUpperCase()
        .includes("RIO DE MOURO")

        ? "CASA"

        : "FORA";

    document.getElementById(
        "jogo"
    ).innerHTML =
    adversario;

    document.getElementById(
        "tipoJogo"
    ).innerHTML =
    local;

    document.getElementById(
        "dataJogo"
    ).innerHTML =
    `
    ${s.proximo_jogo?.data || "-"}
    •
    ${s.proximo_jogo?.hora || "-"}
    `;

    /* =====================
       HERO
    ===================== */

    document.getElementById(
        "heroPosicao"
    ).innerText =
    r.posicao
    ? `${r.posicao}º`
    : "-";

    document.getElementById(
        "heroPontos"
    ).innerText =
    `${r.pontos || 0} Pontos`;

    /* =====================
       RESUMO
    ===================== */

    document.getElementById(
        "jogos"
    ).innerText =
    r.j || 0;

    document.getElementById(
        "pontos"
    ).innerText =
    r.pontos || 0;

    document.getElementById(
        "vitorias"
    ).innerText =
    r.v || 0;

    document.getElementById(
        "empates"
    ).innerText =
    r.e || 0;

    document.getElementById(
        "derrotas"
    ).innerText =
    r.d || 0;

    document.getElementById(
        "dg"
    ).innerText =
    r.dg || "-";

    /* =====================
       FORMA
    ===================== */

    const simbolos = {

        V:"🟢",
        E:"🟡",
        D:"🔴"

    };

    let formaHtml = "";

    forma.forEach(x=>{

        formaHtml += `

        <div class="forma-item">

            <div class="forma-bola">

                ${simbolos[x] || "⚪"}

            </div>

            <div>

                ${x}

            </div>

        </div>

        `;

    });

    document.getElementById(
        "forma"
    ).innerHTML =
    formaHtml;

    /* =====================
       INDICADORES
    ===================== */

    document.getElementById(
        "semPerder"
    ).innerText =
    data.series?.sem_perder || 0;

    document.getElementById(
        "aVencer"
    ).innerText =
    data.series?.a_vencer || 0;

    document.getElementById(
        "aMarcar"
    ).innerText =
    data.series?.a_marcar || 0;

    document.getElementById(
        "aSofrer"
    ).innerText =
    data.series?.a_sofrer || 0;

    /* =====================
       GOLOS
    ===================== */

    document.getElementById(
        "gm"
    ).innerText =
    r.gm || 0;

    document.getElementById(
        "gs"
    ).innerText =
    r.gs || 0;

    document.getElementById(
        "mediaGM"
    ).innerText =

    r.j
    ? (r.gm / r.j).toFixed(2)
    : "0";

    document.getElementById(
        "mediaGS"
    ).innerText =

    r.j
    ? (r.gs / r.j).toFixed(2)
    : "0";

    /* =====================
       CLASSIFICAÇÃO
    ===================== */

    let classificacao = "";

    (data.classificacao || [])
    .forEach(eq=>{

        classificacao += `

        <div class="
            linha
            ${eq.rio_mouro ? 'rdm' : ''}
        ">

            <div>

                ${eq.pos}º
                -
                ${eq.equipa}

            </div>

            <div>

                ${eq.pts} pts

            </div>

        </div>

        `;

    });

    document.getElementById(
        "classificacao"
    ).innerHTML =
    classificacao;

    /* =====================
       ARBITRAGEM
    ===================== */

    let arb = `

    <div class="linha">

        <span>

            Árbitro

        </span>

        <strong>

            ${
                s.proximo_jogo?.arbitro
                || "-"
            }

        </strong>

    </div>

    `;

    (
        s.proximo_jogo?.assistentes
        || []
    ).forEach(a=>{

        arb += `

        <div class="linha">

            <span>

                Assistente

            </span>

            <strong>

                ${a}

            </strong>

        </div>

        `;

    });

    document.getElementById(
        "arbitragem"
    ).innerHTML =
    arb;

    /* =====================
       ADVERSÁRIO
    ===================== */

    document.getElementById(
        "nomeAdversario"
    ).innerText =
    adv.nome || "-";

    document.getElementById(
        "resumoAdversario"
    ).innerHTML =

    `
    <div class="kpi-grid">

        <div class="kpi-box">

            <div class="kpi-num">
                ${adv.posicao || "-"}
            </div>

            <div>Posição</div>

        </div>

        <div class="kpi-box">

            <div class="kpi-num">
                ${adv.pontos || "-"}
            </div>

            <div>Pontos</div>

        </div>

        <div class="kpi-box">

            <div class="kpi-num">
                ${adv.vitorias || 0}
            </div>

            <div>Vitórias</div>

        </div>

        <div class="kpi-box">

            <div class="kpi-num">
                ${adv.empates || 0}
            </div>

            <div>Empates</div>

        </div>

        <div class="kpi-box">

            <div class="kpi-num">
                ${adv.derrotas || 0}
            </div>

            <div>Derrotas</div>

        </div>

        <div class="kpi-box">

            <div class="kpi-num">
                ${adv.dg || "-"}
            </div>

            <div>DG</div>

        </div>

    </div>
    `;

    /* =====================
       ÚLTIMOS RESULTADOS
    ===================== */

    let resultados = "";

    (
        adv.ultimos_resultados || []
    ).forEach(j=>{

        let classe =
        "resultado-e";

        if(j.estado==="V")
            classe =
            "resultado-v";

        if(j.estado==="D")
            classe =
            "resultado-d";

        resultados += `

        <div
            class="box ${classe}">

            ${j.texto}

        </div>

        `;

    });

    document.getElementById(
        "ultimosResultados"
    ).innerHTML =
    resultados;

    /* =====================
       CASTIGADOS
    ===================== */

    let cast = `

    <div class="box">

        <strong>

            Rio de Mouro

        </strong>

        <br><br>

    `;

    if(
        (s.castigos?.lista || [])
        .length === 0
    ){

        cast +=
        "✅ Sem castigados";

    }
    else{

        s.castigos.lista.forEach(x=>{

            cast += `
            🚫 ${x.nome}<br>
            `;

        });

    }

    cast += `

    </div>

    <div class="box">

        <strong>

            ${adv.nome || "Adversário"}

        </strong>

        <br><br>

        🚫 ${
            s.proximo_adversario?.castigados
            || 0
        } castigados

    </div>

    `;

    document.getElementById(
        "castigados"
    ).innerHTML =
    cast;

    /* =====================
       RISCO
    ===================== */

    let risco = "";

    (
        s.cartoes?.risco || []
    ).forEach(x=>{

        risco += `

        <div class="risco">

            <span>

                ${x.nome}

            </span>

            <strong>

                ${x.cartoes}

            </strong>

        </div>

        `;

    });

    document.getElementById(
        "risco"
    ).innerHTML =
    risco;

    /* =====================
       PRÓXIMA JORNADA
    ===================== */

    const prox =
    s.proxima_jornada || {};

    const proxAdv =

        prox.casa
        ?.toUpperCase()
        .includes(
            "RIO DE MOURO"
        )

        ? prox.fora

        : prox.casa;

    const proxLocal =

        prox.casa
        ?.toUpperCase()
        .includes(
            "RIO DE MOURO"
        )

        ? "CASA"

        : "FORA";

    document.getElementById(
        "proximaJornada"
    ).innerHTML =

    `
    ${proxAdv || "-"}

    <br><br>

    <span style="
    color:#ffd700">

        ${proxLocal}

    </span>

    <br><br>

    ${prox.data || "-"}
    •
    ${prox.hora || "-"}

    `;

    document.getElementById(
        "atualizacao"
    ).innerHTML =

    "Atualizado: "
    +
    (
        data.ultima_atualizacao
        || "-"
    );

}

carregarDados();

</script>

</body>

</html>
