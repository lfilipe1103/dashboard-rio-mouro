<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Estatísticas da Época</title>

<style>

:root{

    --card:#13213a;
    --border:#2d4369;
    --gold:#ffd700;

}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:
    radial-gradient(
        circle at top,
        #12203a,
        #050505
    );

    color:white;

    font-family:
    "Segoe UI",
    Arial,
    sans-serif;

    padding:20px;
}

.container{

    max-width:700px;
    margin:auto;

}

.card{

    background:
    linear-gradient(
        180deg,
        #13213a,
        #1c2d4a
    );

    border:1px solid var(--border);

    border-radius:24px;

    padding:20px;

    margin-bottom:18px;
}

.titulo{

    text-align:center;

    font-size:24px;

    font-weight:800;

    margin-bottom:20px;
}

.resumo-grid{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:12px;
}

.bloco{

    background:#223758;

    border-radius:16px;

    padding:18px;

    text-align:center;
}

.numero{

    font-size:38px;

    font-weight:900;
}

.label{

    color:#b8c7da;

    margin-top:6px;
}

.forma{

    display:flex;

    justify-content:center;

    gap:18px;

    margin-top:20px;
}

.forma-item{

    text-align:center;
}

.forma-bola{

    font-size:32px;
}

.indicadores{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:12px;
}

.linha{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:12px;

    border-radius:12px;

    background:#223758;

    margin-bottom:8px;
}

.rdm{

    background:
    linear-gradient(
        135deg,
        #8a5c00,
        #d49a00
    );
}

.botao{

    width:100%;

    border:none;

    border-radius:18px;

    padding:18px;

    background:
    linear-gradient(
        135deg,
        #35589b,
        #4a78d1
    );

    color:white;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;
}

.atualizacao{

    text-align:center;

    color:#9fb0c9;

    font-size:13px;
}

</style>

</head>

<body>

<div class="container">

    <div class="card">

        <div class="titulo">

            📈 Estatísticas da Época

        </div>

        <div id="conteudo">

            A carregar...

        </div>

    </div>

    <div class="card">

        <button
            class="botao"
            onclick="location.href='index.html'">

            ⬅️ Voltar

        </button>

    </div>

    <div
        id="atualizacao"
        class="atualizacao">

    </div>

</div>

<script>

async function carregarDados(){

    try{

        const resp =
        await fetch(
            "./dashboard_data.json?t="
            + Date.now()
        );

        const data =
        await resp.json();

        const r =
        data.resumo_epoca || {};

        const f =
        data.factos || {};

        const s =
        data.series || {};

        const forma =
        data.forma || [];

        const simbolos = {

            V:"🟢",
            E:"🟡",
            D:"🔴"

        };

        let formaHtml = "";

        forma.forEach(x=>{

            formaHtml += `

            <div class="forma-item">

                <div class="forma-bola">

                    ${simbolos[x]}

                </div>

                <div>

                    ${x}

                </div>

            </div>

            `;
        });

        let classificacao = "";

        (data.classificacao || [])
        .forEach(eq=>{

            classificacao += `

            <div class="
                linha
                ${eq.rio_mouro ? 'rdm' : ''}
            ">

                <div>

                    ${eq.pos}º
                    -
                    ${eq.equipa}

                </div>

                <div>

                    ${eq.pts} pts

                </div>

            </div>

            `;
        });

        document
        .getElementById(
            "conteudo"
        )
        .innerHTML = `

        <h2 style="text-align:center;margin-bottom:15px">

            🏆 Resumo Geral

        </h2>

        <div class="resumo-grid">

            <div class="bloco">

                <div class="numero">

                    ${f.jogos || 0}

                </div>

                <div class="label">

                    Jogos

                </div>

            </div>

            <div class="bloco">

                <div class="numero"
                     style="color:#ffd700">

                    ${r.pontos || 0}

                </div>

                <div class="label">

                    Pontos

                </div>

            </div>

            <div class="bloco">

                <div class="numero"
                     style="color:#2ecc71">

                    ${f.vitorias || 0}

                </div>

                <div class="label">

                    Vitórias

                </div>

            </div>

            <div class="bloco">

                <div class="numero"
                     style="color:#ffd700">

                    ${s.percentagem_vitorias || 0}%

                </div>

                <div class="label">

                    Aproveitamento

                </div>

            </div>

        </div>

        <br>

        <h2 style="text-align:center;margin-bottom:15px">

            🔥 Forma Atual

        </h2>

        <div class="forma">

            ${formaHtml}

        </div>

        <br>

        <h2 style="text-align:center;margin-bottom:15px">

            📈 Indicadores

        </h2>

        <div class="indicadores">

            <div class="bloco">
                <div class="numero">${s.sem_perder || 0}</div>
                <div class="label">Sem Perder</div>
            </div>

            <div class="bloco">
                <div class="numero">${s.a_vencer || 0}</div>
                <div class="label">A Vencer</div>
            </div>

            <div class="bloco">
                <div class="numero">${s.a_marcar || 0}</div>
                <div class="label">A Marcar</div>
            </div>

            <div class="bloco">
                <div class="numero">${s.a_sofrer || 0}</div>
                <div class="label">A Sofrer</div>
            </div>

        </div>

        <br>

        <h2 style="text-align:center;margin-bottom:15px">

            ⚽ Golos

        </h2>

        <div class="indicadores">

            <div class="bloco">
                <div class="numero">${f.golos_marcados || 0}</div>
                <div class="label">Marcados</div>
            </div>

            <div class="bloco">
                <div class="numero">${f.golos_sofridos || 0}</div>
                <div class="label">Sofridos</div>
            </div>

            <div class="bloco">
                <div class="numero">${f.media_golos_marcados || 0}</div>
                <div class="label">Média GM</div>
            </div>

            <div class="bloco">
                <div class="numero">${f.media_golos_sofridos || 0}</div>
                <div class="label">Média GS</div>
            </div>

        </div>

        <br>

        <h2 style="text-align:center;margin-bottom:15px">

            🏆 Classificação

        </h2>

        ${classificacao}

        `;

        document
        .getElementById(
            "atualizacao"
        )
        .innerHTML =
        "Atualizado: "
        +
        (data.ultima_atualizacao || "-");

    }
    catch(err){

        console.error(err);

    }

}

carregarDados();

</script>

</body>

</html>
