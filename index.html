<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>GD Rio de Mouro</title>

<style>

:root{

    --bg:#06111f;
    --card:#13213a;
    --card2:#1c2d4a;
    --border:#2d4369;

    --text:#ffffff;
    --muted:#9fb0c9;

    --green:#22c55e;
    --yellow:#facc15;
    --red:#ef4444;
    --blue:#3b82f6;

}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:
    radial-gradient(
        circle at top,
        #10203d,
        #06111f
    );

    color:var(--text);

    font-family:
    "Segoe UI",
    Arial,
    sans-serif;

    padding:15px;

    min-height:100vh;

}

.container{

    max-width:700px;
    margin:auto;

}

.card{

    background:#10203d;

    border:1px solid #2e4c78;

    border-radius:20px;

    padding:18px;

    margin-bottom:15px;

    box-shadow:
    0 8px 30px rgba(
        0,
        0,
        0,
        .35
    );

}

.logo{

    display:flex;

    justify-content:center;

    margin-bottom:15px;

}

.logo img{

    width:130px;
    height:130px;

    object-fit:contain;

    filter:
    drop-shadow(
        0 0 15px
        rgba(255,255,255,.15)
    );

}

.topo{

    text-align:center;

    background:
    linear-gradient(
        135deg,
        #0f172a,
        #1e3a8a
    );

}

.subtitulo{

    color:var(--muted);

    margin-top:10px;

    font-size:17px;

}

.atualizacao{

    margin-top:12px;

    color:var(--muted);

    font-size:13px;

}

.titulo{

    font-size:20px;

    font-weight:700;

    margin-bottom:15px;

    text-align:center;

}

.posicao{

    font-size:72px;

    font-weight:900;

    color:var(--yellow);

    text-align:center;

}

.lugar{

    text-align:center;

    color:var(--muted);

    font-size:16px;

}

.pontos{

    text-align:center;

    margin-top:12px;

    font-size:24px;

    font-weight:800;

}

.forma{

    margin-top:20px;

    display:flex;

    justify-content:center;

    gap:18px;

}

.forma-item{

    text-align:center;

}

.forma-bola{

    font-size:34px;

}

.forma-letra{

    font-weight:bold;

    margin-top:4px;

}

.legenda{

    text-align:center;

    margin-top:20px;

    font-size:13px;

    color:var(--muted);

}

.botao-menu{

    width:100%;

    border:none;

    border-radius:18px;

    padding:20px;

    margin-bottom:14px;

    background:
    linear-gradient(
        135deg,
        #2563eb,
        #1d4ed8
    );

    color:white;

    font-size:20px;

    font-weight:700;

    cursor:pointer;

    transition:.25s;

    box-shadow:
    0 8px 20px rgba(
        37,
        99,
        235,
        .25
    );

}

.botao-menu:hover{

    transform:
    translateY(-4px);

    box-shadow:
    0 12px 28px rgba(
        37,
        99,
        235,
        .35
    );

}

.botao-menu.verde{

    background:
    linear-gradient(
        135deg,
        #22c55e,
        #16a34a
    );

    box-shadow:
    0 8px 20px rgba(
        34,
        197,
        94,
        .25
    );

}

.botao-menu.roxo{

    background:
    linear-gradient(
        135deg,
        #7c3aed,
        #9333ea
    );

    box-shadow:
    0 8px 20px rgba(
        124,
        58,
        237,
        .25
    );

}    
    
.botao-menu.amarelo{

    background:
    linear-gradient(
        135deg,
        #f59e0b,
        #d97706
    );

    box-shadow:
    0 8px 20px rgba(
        245,
        158,
        11,
        .25
    );

}

.botao-menu.vermelho{

    background:
    linear-gradient(
        135deg,
        #ef4444,
        #dc2626
    );

    box-shadow:
    0 8px 20px rgba(
        239,
        68,
        68,
        .25
    );

}

.rodape{

    text-align:center;

    color:var(--muted);

    font-size:12px;

}

</style>

</head>

<body>

<div class="container">

<div class="card topo">

    <div class="logo">

        <img
            src="logo.png"
            alt="GD Rio de Mouro">

    </div>

    <h1>

        GD RIO DE MOURO

    </h1>

    <div class="subtitulo">

        Plataforma de Gestão Desportiva

    </div>

    <div
        id="atualizacao_topo"
        class="atualizacao">

        A carregar...

    </div>

</div>

<div class="card">

    <div class="titulo">

        📊 Resumo da Época

    </div>

    <div id="resumo">

        A carregar...

    </div>

</div>

<div class="card">

    <button
        class="botao-menu"
        onclick="location.href='dashboard.html'">

        ⚽ Próximo Jogo

    </button>

    <button
    class="botao-menu roxo"
    onclick="location.href='analise.html'">

    🧠 Sala de Análise

</button>

    <button
        class="botao-menu verde"
        onclick="location.href='estatisticas.html'">

        📊 Estatísticas Individuais

    </button>

    <button
        class="botao-menu amarelo"
        onclick="location.href='estatisticas-equipa.html'">

        📈 Estatísticas Época

    </button>

    <button
        class="botao-menu vermelho"
        onclick="location.href='mister.html'">

        🧑‍🏫 Área Técnica

    </button>

</div>

<div class="card">

    <div class="rodape">

        <span id="atualizacao">

            GD Rio de Mouro

        </span>

    </div>

</div>

</div>

<script>

async function carregarDados(){

    try{

        const resp =
            await fetch(
                './dashboard_data.json?t='
                + Date.now()
            );

        const data =
            await resp.json();

        const r =
            data.resumo_epoca;

        const forma =
            data.forma || [];

        const simbolos = {

            V:"🟢",
            E:"🟡",
            D:"🔴"

        };

        let formaHtml = "";

        forma.forEach(x=>{

            formaHtml += `

            <div class="forma-item">

                <div class="forma-bola">

                    ${simbolos[x] || "⚪"}

                </div>

                <div class="forma-letra">

                    ${x}

                </div>

            </div>

            `;

        });

        document
        .getElementById(
            "resumo"
        )
        .innerHTML = `

        <div class="posicao">

            ${r.posicao}º

        </div>

        <div class="lugar">

            Lugar Atual

        </div>

        <div class="pontos">

            🏆 ${r.pontos} pontos

        </div>

        <div class="forma">

            ${formaHtml}

        </div>

        <div class="legenda">

            V = Vitória • E = Empate • D = Derrota

        </div>

        `;

        if(
            data.ultima_atualizacao
        ){

            document
            .getElementById(
                "atualizacao"
            )
            .innerHTML =

            "Atualizado: "
            +
            data.ultima_atualizacao;

            document
            .getElementById(
                "atualizacao_topo"
            )
            .innerHTML =

            "Atualizado: "
            +
            data.ultima_atualizacao;

        }

    }
    catch(err){

        console.log(err);

        document
        .getElementById(
            "resumo"
        )
        .innerHTML =

        `
        <div
            style="
            text-align:center;
            color:#ef4444;
            ">

            Erro ao carregar
            dados da época.

        </div>
        `;

    }

}

carregarDados();

</script>

</body>

</html>
