<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>GD Rio de Mouro</title>

<style>

:root{

    --bg:#050505;
    --card:#13213a;
    --border:#2d4369;
    --text:#ffffff;
    --muted:#9fb0c9;

}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:var(--bg);
    color:var(--text);

    font-family:
    "Segoe UI",
    Arial,
    sans-serif;

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

}

.container{

    width:100%;
    max-width:500px;

}

.card{

    background:var(--card);

    border:1px solid var(--border);

    border-radius:24px;

    padding:24px;

    margin-bottom:15px;

    box-shadow:
    0 10px 25px
    rgba(0,0,0,.30);

}

.topo{

    text-align:center;

    background:
    linear-gradient(
        135deg,
        #13213a,
        #1c2d4a
    );

}

.logo{

    display:flex;
    justify-content:center;

    margin-bottom:15px;

}

.logo img{

    width:100px;
    height:100px;

    object-fit:contain;

}

.topo h1{

    font-size:28px;

    margin-bottom:8px;

}

.subtitulo{

    color:var(--muted);
    font-size:14px;

}

.titulo{

    font-size:18px;
    font-weight:700;

    margin-bottom:20px;

    text-align:center;

}

.botao-menu{

    width:100%;

    padding:18px;

    margin-bottom:12px;

    border:none;

    border-radius:16px;

    background:
    linear-gradient(
        135deg,
        #314b77,
        #3f639e
    );

    color:white;

    font-size:18px;

    font-weight:600;

    cursor:pointer;

}

.info-centro{

    text-align:center;

}

.numero{

    font-size:42px;
    font-weight:bold;
    color:#ffd700;

}

.linha{

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:10px;

    margin-bottom:6px;

    border-radius:12px;

    background:#1c2d4a;

}

.rodape{

    text-align:center;
    color:var(--muted);
    font-size:12px;

}

</style>

</head>

<body>

<div class="container">

    <div class="card topo">

        <div class="logo">

            <img
                src="logo.png"
                alt="GD Rio de Mouro">

        </div>

        <h1>
            GD RIO DE MOURO
        </h1>

        <div class="subtitulo">
            Plataforma de Gestão Desportiva
        </div>

    </div>

    <div class="card">

        <div class="titulo">
            📊 Resumo da Época
        </div>

        <div id="resumo">
            A carregar...
        </div>

    </div>

    <div class="card">

        <div class="titulo">
            🏆 Classificação
        </div>

        <div id="classificacao">
            A carregar...
        </div>

    </div>

    <div class="card">

        <div class="titulo">
            📈 Forma Recente
        </div>

        <div
            id="forma"
            class="info-centro">

            A carregar...

        </div>

    </div>

    <div class="card">

        <div class="titulo">

            Selecionar Área

        </div>

        <button
            class="botao-menu"
            onclick="
            location.href='dashboard.html'
            ">

            📊 Dashboard

        </button>

        <button
            class="botao-menu"
            onclick="
            location.href='mister.html'
            ">

            🧑‍🏫 Área Técnica

        </button>

    </div>

    <div class="card">

        <div class="rodape">

            <span id="atualizacao">
                GDRRM V4
            </span>

        </div>

    </div>

</div>

<script>

async function carregarDados() {

    try {

        const resp = await fetch(
            "./dashboard_data.json?t=" +
            Date.now()
        );

        const data =
            await resp.json();

        // =====================
        // RESUMO
        // =====================

        const r =
            data.resumo_epoca;

        if(r){

            document.getElementById(
                "resumo"
            ).innerHTML = `

                <div class="info-centro">

                    <div class="numero">
                        ${r.posicao}º
                    </div>

                    <div>
                        ${r.pontos} pontos
                    </div>

                    <br>

                    <div>
                        ${r.v}V ·
                        ${r.e}E ·
                        ${r.d}D
                    </div>

                    <div>
                        ⚽ ${r.gm}
                        -
                        ${r.gs}
                    </div>

                </div>

            `;
        }

        // =====================
        // CLASSIFICAÇÃO
        // =====================

        let html = "";

        const top2 =
            data.contexto_classificacao.top2 || [];

        const acima =
            data.contexto_classificacao.acima || [];

        const rdm =
            data.contexto_classificacao.rio_mouro;

        const abaixo =
            data.contexto_classificacao.abaixo || [];

        const lista = [
            ...top2,
            ...acima,
            ...[rdm],
            ...abaixo
        ];

        let usados = [];

        lista.forEach(eq => {

            if(!eq) return;

            if(usados.includes(eq.pos))
                return;

            usados.push(eq.pos);

            html += `
            <div class="linha"
                 style="
                 background:${
                    eq.rio_mouro
                    ? '#A66C00'
                    : '#1c2d4a'
                 };
                 ">

                <div>

                    <span style="
                        font-weight:bold;
                        color:${
                            eq.pos === 1
                            ? '#2ecc71'
                            : eq.pos === 2
                                ? '#8bc34a'
                                : '#ffffff'
                        };
                    ">
                        ${eq.pos}º
                    </span>

                    ${eq.equipa}

                </div>

                <div style="
                    font-weight:bold;
                    color:#ffd700;
                ">
                    ${eq.pts}
                </div>

            </div>
            `;
        });

        document.getElementById(
            "classificacao"
        ).innerHTML = html;

        // =====================
        // FORMA
        // =====================

        const simbolos = {

            "V":"🟢",
            "E":"🟡",
            "D":"🔴"

        };

        let formaHtml = "";

        (data.forma || []).forEach(
            r => {

                formaHtml += `
                    <span style="
                        font-size:32px;
                        margin-right:5px;
                    ">
                        ${simbolos[r]}
                    </span>
                `;

            }
        );

        document.getElementById(
            "forma"
        ).innerHTML = formaHtml;

        // =====================
        // DATA
        // =====================

        if(data.ultima_atualizacao){

            document.getElementById(
                "atualizacao"
            ).innerHTML =
                "Atualizado: " +
                data.ultima_atualizacao;
        }

    }

    catch(err){

        console.error(err);

    }

}

carregarDados();

</script>

</body>

</html>
