<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>GD Rio de Mouro</title>

<style>

:root{
    --bg:#050505;
    --card:#13213a;
    --border:#2d4369;
    --gold:#ffd700;
    --text:#ffffff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:
    radial-gradient(
        circle at top,
        #12203a,
        #050505
    );

    font-family:
    "Segoe UI",
    Arial,
    sans-serif;

    color:white;

    min-height:100vh;

    padding:20px;
}

.container{

    width:100%;
    max-width:560px;
    margin:auto;
}

.card{

    background:
    linear-gradient(
        180deg,
        #13213a,
        #1b2d4b
    );

    border:1px solid #29436c;

    border-radius:28px;

    padding:24px;

    margin-bottom:18px;

    box-shadow:
    0 10px 30px rgba(0,0,0,.35);
}

.topo{

    text-align:center;
}

.logo img{

    width:130px;
    height:130px;
    object-fit:contain;
}

.subtitulo{

    font-size:18px;

    color:#dbe4f3;

    margin-top:12px;
}

.atualizacao{

    margin-top:12px;

    font-size:14px;

    color:#9fb0c9;
}

.titulo{

    text-align:center;

    font-size:20px;

    font-weight:700;

    margin-bottom:20px;
}

.posicao{

    font-size:76px;

    font-weight:900;

    color:var(--gold);

    text-align:center;
}

.lugar{

    text-align:center;

    color:#9fb0c9;

    font-size:18px;

    margin-top:10px;
}

.pontos{

    text-align:center;

    margin-top:15px;

    font-size:24px;

    font-weight:bold;
}

.forma{

    margin-top:25px;

    display:flex;

    justify-content:center;

    gap:20px;
}

.forma-item{

    text-align:center;
}

.forma-bola{

    font-size:34px;
}

.forma-letra{

    margin-top:5px;

    font-weight:bold;
}

.legenda{

    margin-top:20px;

    text-align:center;

    color:#a7b8cf;

    font-size:14px;
}

.botao-menu{

    width:100%;

    border:none;

    border-radius:18px;

    padding:20px;

    margin-bottom:14px;

    background:
    linear-gradient(
        135deg,
        #35589b,
        #4a78d1
    );

    color:white;

    font-size:20px;

    font-weight:700;

    cursor:pointer;

    transition:.2s;
}

.botao-menu:hover{

    transform:
    translateY(-2px);
}

.rodape{

    text-align:center;

    font-size:12px;

    color:#9fb0c9;
}

</style>

</head>

<body>

<div class="container">

    <div class="card topo">

        <div class="logo">

            <img
                src="logo.png"
                alt="GD Rio de Mouro">

        </div>

        <div class="subtitulo">

            Plataforma de Gestão Desportiva

        </div>

        <div
            id="atualizacao_topo"
            class="atualizacao">

            A carregar...

        </div>

    </div>

    <div class="card">

        <div class="titulo">

            📊 Resumo da Época

        </div>

        <div id="resumo">

            A carregar...

        </div>

    </div>

    <div class="card">

        <button
            class="botao-menu"
            onclick="location.href='dashboard.html'">

            📊 Próximo Jogo

        </button>

        <button
            class="botao-menu"
            onclick="location.href='estatisticas.html'">

            📈 Estatísticas Época

        </button>

        <button
            class="botao-menu"
            onclick="location.href='mister.html'">

            🧑‍🏫 Gestão da Equipa

        </button>

    </div>

    <div class="card">

        <div class="rodape">

            <span id="atualizacao">

                GDRRM

            </span>

        </div>

    </div>

</div>

<script>

async function carregarDados(){

    try{

        const resp =
        await fetch(
            './dashboard_data.json?t='
            + Date.now()
        );

        const data =
        await resp.json();

        const r =
        data.resumo_epoca;

        const forma =
        data.forma || [];

        const simbolos = {

            V:"🟢",
            E:"🟡",
            D:"🔴"

        };

        let formaHtml = "";

        forma.forEach(x=>{

            formaHtml += `

            <div class="forma-item">

                <div class="forma-bola">

                    ${simbolos[x]}

                </div>

                <div class="forma-letra">

                    ${x}

                </div>

            </div>

            `;
        });

        document
        .getElementById("resumo")
        .innerHTML = `

        <div class="posicao">

            ${r.posicao}º

        </div>

        <div class="lugar">

            Lugar Atual

        </div>

        <div class="pontos">

            🏆 ${r.pontos} pontos

        </div>

        <div class="forma">

            ${formaHtml}

        </div>

        <div class="legenda">

            V = Vitória • E = Empate • D = Derrota

        </div>

        `;

        if(
            data.ultima_atualizacao
        ){

            document
            .getElementById(
                "atualizacao"
            )
            .innerHTML =
            "Atualizado: " +
            data.ultima_atualizacao;

            document
            .getElementById(
                "atualizacao_topo"
            )
            .innerHTML =
            "Atualizado: " +
            data.ultima_atualizacao;
        }

    }
    catch(err){

        console.log(err);

    }

}

carregarDados();

</script>

</body>

</html>
