<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>GD Rio de Mouro</title>

<style>

:root{

    --bg:#050505;
    --card:#13213a;
    --card2:#1c2d4a;

    --border:#2d4369;

    --gold:#ffd700;
    --goldDark:#b8860b;

    --green:#2ecc71;
    --yellow:#f1c40f;
    --red:#e74c3c;

    --text:#ffffff;
    --muted:#9fb0c9;

}

*{

    margin:0;
    padding:0;
    box-sizing:border-box;

}

body{

    background:
    radial-gradient(
        circle at top,
        #12203a,
        #050505
    );

    color:var(--text);

    font-family:
    "Segoe UI",
    Arial,
    sans-serif;

    min-height:100vh;

    padding:20px;

}

.container{

    width:100%;
    max-width:560px;
    margin:auto;

}

.card{

    background:
    linear-gradient(
        180deg,
        #13213a,
        #192b4b
    );

    border:1px solid var(--border);

    border-radius:24px;

    padding:22px;

    margin-bottom:16px;

    box-shadow:
        0 12px 30px
        rgba(0,0,0,.35);

}

.topo{

    text-align:center;

}

.logo{

    display:flex;
    justify-content:center;

}

.logo img{

    width:120px;
    height:120px;

    object-fit:contain;

}

.nome-clube{

    font-size:30px;
    font-weight:800;

    margin-top:10px;

}

.subtitulo{

    color:#bcc8d8;

    margin-top:6px;

}

.atualizacao-topo{

    margin-top:10px;

    color:#91a5c3;

    font-size:12px;

}

.titulo{

    text-align:center;

    font-size:20px;
    font-weight:700;

    margin-bottom:20px;

}

.posicao{

    font-size:70px;
    font-weight:800;

    color:var(--gold);

    line-height:1;

}

.pontos{

    font-size:24px;
    font-weight:bold;

    margin-top:10px;

}

.forma-row{

    display:flex;

    justify-content:center;

    gap:14px;

    margin-top:20px;

}

.forma-item{

    display:flex;

    flex-direction:column;

    align-items:center;

}

.forma-label{

    color:#c3d1e3;

    font-size:12px;

    font-weight:bold;

}

.stats-grid{

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:10px;

    margin-top:20px;

}

.stat-card{

    background:#203250;

    border-radius:14px;

    padding:12px;

    text-align:center;

}

.stat-num{

    font-size:24px;
    font-weight:bold;

}

.stat-label{

    color:#9fb0c9;

    font-size:12px;

    margin-top:4px;

}

.linha{

    display:flex;

    justify-content:space-between;

    align-items:center;

    background:#203250;

    padding:12px;

    border-radius:14px;

    margin-bottom:8px;

}

.rdm{

    background:
    linear-gradient(
        135deg,
        #8a5c00,
        #d49a00
    );

}

.botao-menu{

    width:100%;

    border:none;

    border-radius:16px;

    padding:18px;

    margin-bottom:12px;

    background:
    linear-gradient(
        135deg,
        #35589b,
        #4a78d1
    );

    color:white;

    font-size:18px;

    font-weight:700;

    cursor:pointer;

    transition:.2s;

}

.botao-menu:hover{

    transform:
    translateY(-2px);

}

.rodape{

    text-align:center;

    font-size:12px;

    color:#aab7c8;

}

</style>

</head>

<body>

<div class="container">

    <div class="card topo">

        <div class="logo">

            <img
                src="logo.png"
                alt="GD Rio de Mouro">

        </div>

        <div class="subtitulo">

            Plataforma de Gestão Desportiva

        </div>

        <div
            id="atualizacao_topo"
            class="atualizacao-topo">

            A carregar...

        </div>

    </div>

    <div class="card">

        <div class="titulo">

            📊 Resumo da Época

        </div>

        <div id="resumo">

            A carregar...

        </div>

    </div>

    <div class="card">

        <div class="titulo">

            🏆 Classificação

        </div>

        <div id="classificacao">

            A carregar...

        </div>

    </div>

    <div class="card">

        <div class="titulo">

            🚀 Acesso Rápido

        </div>

        <button
            class="botao-menu"
            onclick="
            location.href='dashboard.html'
            ">

            📊 Dashboard

        </button>

        <button
            class="botao-menu"
            onclick="
            location.href='mister.html'
            ">

            🧑‍🏫 Área Técnica

        </button>

    </div>

    <div class="card">

        <div class="rodape">

            <span id="atualizacao">

                GDRRM V4

            </span>

        </div>

    </div>

</div>

<script>

async function carregarDados() {

    try {

        const resp = await fetch(
            "./dashboard_data.json?t=" +
            Date.now()
        );

        const data =
            await resp.json();

        const r =
            data.resumo_epoca;

        const forma =
            data.forma || [];

        const simbolos = {

            V:"🟢",
            E:"🟡",
            D:"🔴"

        };

        let formaHtml = "";

        forma.forEach(
            resultado => {

                formaHtml += `

                    <div class="forma-item">

                        <div style="
                            font-size:24px;
                        ">
                            ${simbolos[resultado]}
                        </div>

                        <div class="forma-label">
                            ${resultado}
                        </div>

                    </div>

                `;

            }
        );

        document.getElementById(
            "resumo"
        ).innerHTML = `


<div style="text-align:center">

    <div class="posicao">
        ${r.posicao}º
    </div>

    <div style="
        color:#9fb0c9;
        margin-top:4px;
    ">
        Lugar Atual
    </div>

    <div class="pontos">
        🏆 ${r.pontos} pontos
    </div>

    <div class="forma-row">

        ${formaHtml}

    </div>

    <div style="
        font-size:12px;
        color:#9fb0c9;
        margin-top:10px;
    ">
        V = Vitória • E = Empate • D = Derrota
    </div>

    <div class="stats-grid">

        <div class="stat-card">

            <div
                class="stat-num"
                style="
                color:#2ecc71;
                ">

                ${r.v}

            </div>

            <div class="stat-label">
                Vitórias
            </div>

        </div>

        <div class="stat-card">

            <div
                class="stat-num"
                style="
                color:#f1c40f;
                ">

                ${r.e}

            </div>

            <div class="stat-label">
                Empates
            </div>

        </div>

        <div class="stat-card">

            <div
                class="stat-num"
                style="
                color:#e74c3c;
                ">

                ${r.d}

            </div>

            <div class="stat-label">
                Derrotas
            </div>

        </div>

    </div>

    <div style="
        margin-top:18px;
        background:#203250;
        border-radius:14px;
        padding:14px;
        color:#d5ddeb;
    ">

        ⚽ ${r.gm} GM

        &nbsp;&nbsp;•&nbsp;&nbsp;

        🥅 ${r.gs} GS

        &nbsp;&nbsp;•&nbsp;&nbsp;

        📈 ${r.dg}

    </div>

</div>

`;

        // =====================
        // CLASSIFICAÇÃO
        // =====================

        let html = "";

        const top2 =
            data.contexto_classificacao.top2 || [];

        const acima =
            data.contexto_classificacao.acima || [];

        const rdm =
            data.contexto_classificacao.rio_mouro;

        const abaixo =
            data.contexto_classificacao.abaixo || [];

        const lista = [
            ...top2,
            ...acima,
            ...[rdm],
            ...abaixo
        ];

        let usados = [];

        lista.forEach(eq => {

            if(!eq) return;

            if(
                usados.includes(
                    eq.pos
                )
            ) return;

            usados.push(
                eq.pos
            );

            html += `

            <div
                class="
                linha
                ${eq.rio_mouro ? 'rdm' : ''}
                ">

                <div>

                    <span style="
                        font-weight:bold;
                        color:${
                            eq.pos === 1
                                ? '#2ecc71'
                                : eq.pos === 2
                                    ? '#8bc34a'
                                    : '#ffffff'
                        };
                    ">

                        ${eq.pos}º

                    </span>

                    &nbsp;

                    ${eq.equipa}

                </div>

                <div style="
                    font-weight:bold;
                    color:#ffd700;
                ">

                    ${eq.pts}

                </div>

            </div>

            `;

        });

        document.getElementById(
            "classificacao"
        ).innerHTML = html;

        if(
            data.ultima_atualizacao
        ){

            document.getElementById(
                "atualizacao"
            ).innerHTML =
                "Atualizado: "
                +
                data.ultima_atualizacao;

            document.getElementById(
                "atualizacao_topo"
            ).innerHTML =
                "Atualizado: "
                +
                data.ultima_atualizacao;

        }

    }

    catch(err){

        console.error(err);

    }

}

carregarDados();

</script>

</body>

</html>
