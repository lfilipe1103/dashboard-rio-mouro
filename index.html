<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>GDRRM V3</title>

<style>

:root{
    --bg:#000000;
    --card:#13213a;
    --card2:#1c2d4a;
    --border:#2d4369;

    --text:#ffffff;
    --muted:#9fb0c9;

    --yellow:#facc15;
    --green:#22c55e;
    --red:#ef4444;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Segoe UI,Arial,sans-serif;
    padding:12px;
}

.container{
    max-width:1100px;
    margin:auto;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:18px;
    margin-bottom:12px;
}

.topo{
    text-align:center;
}

.logo{
    font-size:42px;
}

.titulo{
    font-size:18px;
    font-weight:700;
    margin-bottom:15px;
}

.botao-menu{

    display:block;

    width:100%;

    padding:15px;

    margin-bottom:10px;

    border:none;

    border-radius:12px;

    background:#314b77;

    color:white;

    font-size:18px;

    cursor:pointer;

}

.botao-menu:hover{

    opacity:.9;

}

</style>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";

import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    collection,
    getDocs
}
from
"https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const firebaseConfig = {

    apiKey:
    "AIzaSyBCJOZqbFQRByk6hYyeCrqntyPBHW8pZbA",

    authDomain:
    "rdm-v2-98d5b.firebaseapp.com",

    projectId:
    "rdm-v2-98d5b",

    storageBucket:
    "rdm-v2-98d5b.firebasestorage.app",

    messagingSenderId:
    "847254286305",

    appId:
    "1:847254286305:web:eb5d179fb7ed6e5054eca0"

};

const app =
initializeApp(firebaseConfig);

window.firebaseDB =
getFirestore(app);

window.firebaseDoc =
doc;

window.firebaseGetDoc =
getDoc;

window.firebaseSetDoc =
setDoc;

window.firebaseCollection =
collection;

window.firebaseGetDocs =
getDocs;

window.firebaseReady =
true;

</script>

</head>

<body>

<div class="container">

    <div class="card topo">

        <div class="logo">
            ⚽
        </div>

        <h1>
            GD RIO DE MOURO V3
        </h1>

    </div>

    <div class="card">

        <div class="titulo">
            Selecionar Área
        </div>

        <button
            class="botao-menu"
            onclick="
            location.href='dashboard.html'
            ">

            👥 Dashboard

        </button>

        <button
            class="botao-menu"
            onclick="
            location.href='mister.html'
            ">

            🧑‍🏫 Área Mister

        </button>

        <button
            class="botao-menu"
            onclick="
            location.href='admin.html'
            ">

            👑 Área Admin

        </button>

    </div>

</div>

<script>

console.log(
    "Index V3 carregado"
);

console.log(
    "Firebase:",
    window.firebaseReady
);

</script>

</body>

</html>
