<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Área Técnica V4</title>

<style>

:root{

    --bg:#050505;
    --card:#13213a;
    --card2:#1c2d4a;
    --border:#2d4369;

    --text:#ffffff;
    --muted:#9fb0c9;

    --yellow:#facc15;
    --green:#22c55e;
    --red:#ef4444;
    --blue:#3b82f6;

}

*{

    margin:0;
    padding:0;
    box-sizing:border-box;

}

body{

    background:var(--bg);

    color:var(--text);

    font-family:
    "Segoe UI",
    Arial,
    sans-serif;

    padding:12px;

}

.container{

    max-width:1300px;

    margin:auto;

}

.card{

    background:var(--card);

    border:1px solid var(--border);

    border-radius:20px;

    padding:18px;

    margin-bottom:12px;

}

.topo{

    background:
    linear-gradient(
        135deg,
        #13213a,
        #1c2d4a
    );

    text-align:center;

}

.logo{

    display:flex;

    justify-content:center;

    margin-bottom:12px;

}

.logo img{

    width:80px;

    height:80px;

    object-fit:contain;

}

.topo h1{

    margin-bottom:8px;

}

.subtitulo{

    color:var(--muted);

    font-size:14px;

}

.titulo{

    font-size:18px;

    font-weight:700;

    margin-bottom:15px;

    padding-bottom:10px;

    border-bottom:
    1px solid var(--border);

}

input{

    width:100%;

    padding:12px;

    border:none;

    border-radius:12px;

    margin-bottom:10px;

}

.btn{

    width:100%;

    padding:14px;

    border:none;

    border-radius:12px;

    cursor:pointer;

    background:#314b77;

    color:white;

    font-size:16px;

    font-weight:600;

}

.btn-voltar{

    background:#1c2d4a;

}

.grid-kpi{

    display:grid;

    grid-template-columns:
    repeat(4,1fr);

    gap:12px;

    margin-bottom:12px;

}

.kpi{

    text-align:center;

}

.kpi-numero{

    font-size:42px;

    font-weight:700;

}

.kpi-label{

    margin-top:6px;

    color:var(--muted);

}

.verde{
    color:var(--green);
}

.vermelho{
    color:var(--red);
}

.amarelo{
    color:var(--yellow);
}

.azul{
    color:var(--blue);
}

.jogador{

    display:flex;

    justify-content:space-between;

    align-items:center;

    background:var(--card2);

    padding:12px;

    border-radius:12px;

    margin-bottom:8px;

}

.info-jogador{

    display:flex;

    flex-direction:column;

    gap:4px;

}

.idade{

    font-size:12px;

    color:var(--muted);

}

.estado{

    color:var(--yellow);

    font-size:12px;

}

.botoes{

    display:flex;

    gap:5px;

}

.botoes button{

    width:42px;

    height:42px;

    border:none;

    border-radius:12px;

    cursor:pointer;

    font-size:18px;

}

.estat-item{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:12px;

    background:var(--card2);

    margin-bottom:8px;

    border-radius:12px;

}

.loading{

    text-align:center;

    color:var(--muted);

}

@media(max-width:900px){

    .grid-kpi{

        grid-template-columns:
        repeat(2,1fr);

    }

}

</style>

getFirestore(app);

window.firebaseDoc =
doc;

window.firebaseGetDoc =
getDoc;

window.firebaseSetDoc =
setDoc;

window.firebaseCollection =
collection;

window.firebaseGetDocs =
getDocs;

</script>

</head>

        onclick="voltarMenu()">

    <div class="card">

        </div>

            id="dataTreino">

        <button
            class="btn"
            onclick="criarTreino()">

        </button>

        <button

            onclick="abrirTreino()">

    </div>

    <div class="grid-kpi">

        <div class="card kpi">

        </div>

        <div class="card kpi">

                 class="kpi-numero vermelho">

            </div>

        </div>

        <div class="card kpi">

            <div id="kpiLesionados"
                 class="kpi-numero amarelo">

            <div class="kpi-label">

                🩺 Lesionados

            </div>

        </div>

        <div class="card kpi">

            <div id="kpiJustificadas"
                 class="kpi-numero azul">

            <div class="kpi-label">

                🟨 Justificadas

            </div>

        </div>

    </div>

    <div id="plantel">

        <div class="loading">

    </div>

</div>

<div id="areaEstatisticas"
     style="display:none">

    <button
        class="btn btn-voltar"
        onclick="voltarMenu()">

    </button>

    <div class="card">

        <div id="estatisticasMister">

        </div>

            </div>

        </div>

    </div>

    <div class="card">

            🚨 Ranking Ausências

        </div>

        <div id="rankingAusencias">

            <div class="loading">

                A calcular...

            </div>

        </div>

    </div>

</div>

let treinoAtual = {};

function calcularIdade(data){

    const hoje =
    new Date();

    const nasc =
    new Date(data);

    let idade =
    hoje.getFullYear() -
    nasc.getFullYear();

    const m =
    hoje.getMonth() -
    nasc.getMonth();

    if(
        m < 0 ||
        (
            m === 0 &&
            hoje.getDate() <
            nasc.getDate()
        )
    ){
        idade--;
    }

    return idade;

}

document.addEventListener(
    "DOMContentLoaded",
    () => {

        document
        .getElementById(
            "dataTreino"
        )
        .value =
        new Date()
        .toISOString()
        .split("T")[0];

    }
);

function entrar(){

    const pass =
    document
    .getElementById(
        "password"
    )
    .value;

    if(
        pass !== PASSWORD
    ){

        alert(
            "Password incorreta"
        );

        return;

    }

    document
    .getElementById(
        "login"
    )
    .style.display =
    "none";

    document
    .getElementById(
        "menuMister"
    )
    .style.display =

}

function mostrarTreinos(){

    document.getElementById(
        "menuMister"
    ).style.display =
    "none";

    document.getElementById(
        "areaTreinos"
    ).style.display =

    carregarPlantel();

}

async function mostrarEstatisticas(){

    document.getElementById(
        "menuMister"
    ).style.display =
    "none";

    document.getElementById(
        "areaEstatisticas"
    ).style.display =
    "block";

    await atualizarEstatisticas();

}

function voltarMenu(){

    document.getElementById(
        "areaTreinos"
    ).style.display =
    "none";

    document.getElementById(
        "areaEstatisticas"
    ).style.display =
    "none";

    document.getElementById(
        "menuMister"
    ).style.display =
    "block";

}

async function criarTreino(){

    const data =
    document.getElementById(
        "dataTreino"
    ).value;

    await window.firebaseSetDoc(

        window.firebaseDoc(
            window.firebaseDB,
            "treinos",
            data
        ),

        {
            ativo:true,
            criadoEm:
            Date.now()
        },

        {
            merge:true
        }

    );

    treinoAtual = {};

    carregarPlantel();

    atualizarResumo();

    alert(
        "Treino criado."
    );

}

async function abrirTreino(){

    const data =
    document.getElementById(
        "dataTreino"
    ).value;

    const snap =
    await window.firebaseGetDoc(

        window.firebaseDoc(
            window.firebaseDB,
            "treinos",
            data
        )

    );

    if(
        !snap.exists()
    ){

        alert(
            "Treino inexistente."
        );

        return;

    }

    treinoAtual =
    snap.data();

    carregarPlantel();

    atualizarResumo();

}

async function marcarPresenca(
    jogador,
    estado
){

    const data =
    document.getElementById(
        "dataTreino"
    ).value;

    treinoAtual[
        jogador
    ] = estado;

    await window.firebaseSetDoc(

        window.firebaseDoc(
            window.firebaseDB,
            "treinos",
            data
        ),

        {
            [jogador]:
            estado
        },

        {
            merge:true
        }

    );

    atualizarResumo();

    carregarPlantel();

}

function carregarPlantel(){

    const grupos = [

        {
            titulo:"🧤 Guarda-Redes",
            lista:PLANTEL.guardaRedes
        },

        {
            titulo:"🛡️ Defesas",
            lista:PLANTEL.defesas
        },

        {
            titulo:"⚙️ Médios",
            lista:PLANTEL.medios
        },

        {
            titulo:"🎯 Avançados",
            lista:PLANTEL.avancados
        }

    ];

    let html = "";

    grupos.forEach(grupo => {

        html += `
        <div class="card">

        <div class="titulo">

        ${grupo.titulo}

        </div>
        `;

        grupo.lista.forEach(j => {

            const estado =
            treinoAtual[
                j.nome
            ] || "";

            html += `

            <div class="jogador">

                <div class="info-jogador">

                    <strong>
                        ${j.nome}
                    </strong>

                    <div class="idade">

                        ${calcularIdade(
                            j.nascimento
                        )} anos

                    </div>

                    ${
                        estado
                        ?
                        `
                        <div class="estado">
                        ${estado}
                        </div>
                        `
                        :
                        ""
                    }

                </div>

                <div class="botoes">

                <button onclick="marcarPresenca('${j.nome}','✅')">✅</button>

                <button onclick="marcarPresenca('${j.nome}','❌')">❌</button>

                <button onclick="marcarPresenca('${j.nome}','🩺')">🩺</button>

                <button onclick="marcarPresenca('${j.nome}','🟨')">🟨</button>

                </div>

            </div>

            `;

        });

        html += "</div>";

    });

    document.getElementById(
        "plantel"
    ).innerHTML =
    html;

}

function atualizarResumo(){

    let p=0;
    let f=0;
    let l=0;
    let j=0;

    Object.values(
        treinoAtual
    ).forEach(v => {

        if(v==="✅") p++;
        if(v==="❌") f++;
        if(v==="🩺") l++;
        if(v==="🟨") j++;

    });

    document.getElementById(
        "kpiPresentes"
    ).innerText = p;

    document.getElementById(
        "kpiFaltas"
    ).innerText = f;

    document.getElementById(
        "kpiLesionados"
    ).innerText = l;

    document.getElementById(
        "kpiJustificadas"
    ).innerText = j;

}

async function atualizarEstatisticas(){

    const snap =
    await window.firebaseGetDocs(

        window.firebaseCollection(
            window.firebaseDB,
            "treinos"
        )

    );

    const jogadores = {};

    let totalTreinos = 0;

    snap.forEach(doc => {

        totalTreinos++;

        const treino =
        doc.data();

        Object.entries(
            treino
        ).forEach(([nome,estado]) => {

            if(
                nome === "ativo" ||
                nome === "criadoEm"
            ){
                return;
            }

            if(!jogadores[nome]){

                jogadores[nome] = {

                    presencas:0,
                    faltas:0,
                    lesionados:0,
                    justificadas:0

                };

            }

            if(estado==="✅")
                jogadores[nome].presencas++;

            if(estado==="❌")
                jogadores[nome].faltas++;

            if(estado==="🩺")
                jogadores[nome].lesionados++;

            if(estado==="🟨")
                jogadores[nome].justificadas++;

        });

    });

    let presencas=0;
    let faltas=0;
    let lesionados=0;
    let justificadas=0;

    Object.values(
        jogadores
    ).forEach(j => {

        presencas += j.presencas;
        faltas += j.faltas;
        lesionados += j.lesionados;
        justificadas += j.justificadas;

    });

    const totalPlantel =

        Object.keys(
            jogadores
        ).length;

    const taxa =

        presencas +
        faltas +
        lesionados +
        justificadas > 0

        ? Math.round(

            (presencas /

            (
                presencas +
                faltas +
                lesionados +
                justificadas
            )) * 100

        )

        : 0;

    document.getElementById(
        "estatisticasMister"
    ).innerHTML =

    `
    <div class="estat-item">
    <span>👥 Plantel</span>
    <strong>${totalPlantel}</strong>
    </div>

    <div class="estat-item">
    <span>📅 Treinos</span>
    <strong>${totalTreinos}</strong>
    </div>

    <div class="estat-item">
    <span>✅ Presenças</span>
    <strong>${presencas}</strong>
    </div>

    <div class="estat-item">
    <span>❌ Faltas</span>
    <strong>${faltas}</strong>
    </div>

    <div class="estat-item">
    <span>🩺 Lesões</span>
    <strong>${lesionados}</strong>
    </div>

    <div class="estat-item">
    <span>🟨 Justificadas</span>
    <strong>${justificadas}</strong>
    </div>

    <div class="estat-item">
    <span>📈 Taxa Presença</span>
    <strong>${taxa}%</strong>
    </div>
    `;

    const rankingAssiduidade =
    Object.entries(
        jogadores
    )
    .sort(
        (a,b) =>
        b[1].presencas -
        a[1].presencas
    )
    .slice(0,10);

    let htmlA = "";

    rankingAssiduidade
    .forEach(r => {

        htmlA +=
        `
        <div class="estat-item">

            <span>
                ${r[0]}
            </span>

            <strong>
                ${r[1].presencas}
            </strong>

        </div>
        `;

    });

    document.getElementById(
        "rankingAssiduidade"
    ).innerHTML =
    htmlA;

    const rankingAusencias =
    Object.entries(
        jogadores
    )
    .sort(
        (a,b) =>
        b[1].faltas -
        a[1].faltas
    )
    .slice(0,10);

    let htmlF = "";

    rankingAusencias
    .forEach(r => {

        htmlF +=
        `
        <div class="estat-item">

            <span>
                ${r[0]}
            </span>

            <strong>
                ${r[1].faltas}
            </strong>

        </div>
        `;

    });

    document.getElementById(
        "rankingAusencias"
    ).innerHTML =
    htmlF;

}

</script>
