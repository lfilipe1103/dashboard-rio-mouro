<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Área Técnica</title>

<style>

:root{

    --bg:#050505;
    --card:#13213a;
    --card2:#1c2d4a;
    --border:#2d4369;

    --text:#ffffff;
    --muted:#9fb0c9;

    --yellow:#facc15;
    --green:#22c55e;
    --red:#ef4444;
    --blue:#3b82f6;

}

*{

    margin:0;
    padding:0;
    box-sizing:border-box;

}

body{

    background:var(--bg);
    color:var(--text);

    font-family:
    "Segoe UI",
    Arial,
    sans-serif;

    padding:12px;

}

.container{

    max-width:1200px;
    margin:auto;

}

.card{

    background:var(--card);

    border:1px solid var(--border);

    border-radius:20px;

    padding:18px;

    margin-bottom:12px;

}

.topo{

    background:
    linear-gradient(
        135deg,
        #13213a,
        #1c2d4a
    );

    text-align:center;

}

.logo{

    display:flex;

    justify-content:center;

    margin-bottom:10px;

}

.logo img{

    width:70px;

    height:70px;

    object-fit:contain;

}

.topo h1{

    margin-bottom:8px;

}

.subtitulo{

    color:var(--muted);

    font-size:14px;

}

.titulo{

    font-size:18px;

    font-weight:700;

    margin-bottom:15px;

    border-bottom:
    1px solid var(--border);

    padding-bottom:10px;

}

input{

    width:100%;

    padding:12px;

    border:none;

    border-radius:12px;

    margin-bottom:10px;

}

.btn{

    width:100%;

    padding:14px;

    border:none;

    border-radius:12px;

    cursor:pointer;

    background:#314b77;

    color:white;

    font-size:16px;

    font-weight:600;

    transition:.2s;

}

.btn:hover{

    opacity:.95;

}

.btn-voltar{

    background:#1c2d4a;

    margin-bottom:12px;

}

.jogador{

    display:flex;

    justify-content:space-between;

    align-items:center;

    background:var(--card2);

    padding:12px;

    border-radius:12px;

    margin-bottom:8px;

}

.botoes{

    display:flex;

    gap:5px;

}

.botoes button{

    width:42px;

    height:42px;

    border:none;

    border-radius:12px;

    cursor:pointer;

    font-size:18px;

}

.loading{

    text-align:center;

    color:var(--muted);

}

@media(max-width:900px){

    .grid-kpi{

        grid-template-columns:
        repeat(2,1fr);

    }

}

</style>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";

import {
    getFirestore,
    doc,
    getDoc,
    setDoc
}
from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const firebaseConfig = {

    apiKey:
    "AIzaSyBCJOZqbFQRByk6hYyeCrqntyPBHW8pZbA",

    authDomain:
    "rdm-v2-98d5b.firebaseapp.com",

    projectId:
    "rdm-v2-98d5b",

    storageBucket:
    "rdm-v2-98d5b.firebasestorage.app",

    messagingSenderId:
    "847254286305",

    appId:
    "1:847254286305:web:eb5d179fb7ed6e5054eca0"

};

const app =
initializeApp(firebaseConfig);

window.firebaseDB =
getFirestore(app);

window.firebaseDoc =
doc;

window.firebaseGetDoc =
getDoc;

window.firebaseSetDoc =
setDoc;

</script>

</head>

<body>

<div class="container">

<div id="login">

    <div class="card topo">

        <div class="logo">

            <img
                src="logo.png"
                alt="GD Rio de Mouro">

        </div>

        <h1>

            ÁREA TÉCNICA

        </h1>

        <div class="subtitulo">

            Gestão de Treinos e Presenças

        </div>

    </div>

    <div class="card">

        <input
            type="password"
            id="password"
            placeholder="Password Mister">

        <button
            class="btn"
            onclick="entrar()">

            Entrar

        </button>

    </div>

</div>

<div id="menuMister"
     style="display:none">

    <button
        class="btn btn-voltar"
        onclick="location.href='index.html'">

        ← Menu Principal

    </button>

    <div class="card">

        <div class="titulo">

            ⚽ Área Técnica

        </div>

        <button
            class="btn"
            onclick="mostrarTreinos()">

            📅 Gestão de Treino

        </button>

        <br><br>

        <button
            class="btn"
            onclick="mostrarEstatisticas()">

            📊 Estatísticas

        </button>

    </div>

</div>

<div id="areaTreinos"
     style="display:none">

    <button
        class="btn btn-voltar"
        onclick="voltarMenu()">

        ← Voltar

    </button>

    <div class="card">

        <div class="titulo">

            📅 Gestão de Treino

        </div>

        <input
            type="date"
            id="dataTreino">

        <button
            class="btn"
            onclick="criarTreino()">

            Criar Treino

        </button>

        <br><br>

        <button
            class="btn"
            onclick="abrirTreino()">

            Abrir Treino

        </button>

    </div>

    <div class="grid-kpi">

        <div class="card kpi">

            <div id="kpiPresentes"
                 class="kpi-numero verde">

                0

            </div>

            <div class="kpi-label">

                ✅ Presentes

            </div>

        </div>

        <div class="card kpi">

            <div id="kpiFaltas"
                 class="kpi-numero vermelho">

                0

            </div>

            <div class="kpi-label">

                ❌ Faltas

            </div>

        </div>

        <div class="card kpi">

            <div id="kpiLesionados"
                 class="kpi-numero amarelo">

                0

            </div>

            <div class="kpi-label">

                🩺 Lesionados

            </div>

        </div>

        <div class="card kpi">

            <div id="kpiJustificadas"
                 class="kpi-numero azul">

                0

            </div>

            <div class="kpi-label">

                🟨 Justificadas

            </div>

        </div>

    </div>

    <div id="plantel">

        <div class="loading">

            A carregar...

        </div>

    </div>

</div>

<div id="areaEstatisticas"
     style="display:none">

    <button
        class="btn btn-voltar"
        onclick="voltarMenu()">

        ← Voltar

    </button>

    <div class="card">

        <div class="titulo">

            📊 Estatísticas Gerais

        </div>

        <div id="estatisticasMister">

            <div class="loading">

                A calcular...

            </div>

        </div>

    </div>

</div>

</div>

<script>

const PASSWORD =
"MISTER2026";

const PLANTEL = {

    guardaRedes:[

        "Filipe Pereira",
        "Julio Brandão",
        "Henrique Macedo",
        "Renan Lima"

    ],

    defesas:[

        "Daniel Monteiro",
        "Gonçalo Silva",
        "Bruno Calvinho",
        "André Pécurto",
        "Robert Andrade",
        "João Rodrigues",
        "Nuno Gomes",
        "Bernas"

    ],

    medios:[

        "Miguel Fonseca",
        "Bruno Mota",
        "Rodrigo Tomé",
        "Pedro Paulino",
        "João Rascão",
        "Khalifa",
        "Diogo Correia",
        "Rodrigo Delgado",
        "Henrique Martins"

    ],

    avancados:[

        "Guilherme Azevedo",
        "Jota",
        "Guilherme Monteiro",
        "Diogo Teixeira",
        "David Sousa",
        "Kala Furtado",
        "Sana Sambu"

    ]

};

let treinoAtual = {};

document.addEventListener(
    "DOMContentLoaded",
    () => {

        document.getElementById(
            "dataTreino"
        ).value =
        new Date()
        .toISOString()
        .split("T")[0];

    }
);

function entrar(){

    const pass =

    document.getElementById(
        "password"
    ).value;

    if(
        pass !== PASSWORD
    ){

        alert(
            "Password incorreta"
        );

        return;

    }

    document.getElementById(
        "login"
    ).style.display =
    "none";

    document.getElementById(
        "menuMister"
    ).style.display =
    "block";

}

function mostrarTreinos(){

    document.getElementById(
        "menuMister"
    ).style.display =
    "none";

    document.getElementById(
        "areaEstatisticas"
    ).style.display =
    "none";

    document.getElementById(
        "areaTreinos"
    ).style.display =
    "block";

    carregarPlantel();

    atualizarResumo();

}

function mostrarEstatisticas(){

    document.getElementById(
        "menuMister"
    ).style.display =
    "none";

    document.getElementById(
        "areaTreinos"
    ).style.display =
    "none";

    document.getElementById(
        "areaEstatisticas"
    ).style.display =
    "block";

    atualizarEstatisticas();

}

function voltarMenu(){

    document.getElementById(
        "areaTreinos"
    ).style.display =
    "none";

    document.getElementById(
        "areaEstatisticas"
    ).style.display =
    "none";

    document.getElementById(
        "menuMister"
    ).style.display =
    "block";

}

async function criarTreino(){

    const data =

    document.getElementById(
        "dataTreino"
    ).value;

    if(
        !data
    ){

        alert(
            "Seleciona uma data."
        );

        return;

    }

    await window.firebaseSetDoc(

        window.firebaseDoc(
            window.firebaseDB,
            "treinos",
            data
        ),

        {
            ativo:true,
            criadoEm:
            Date.now()
        },

        {
            merge:true
        }

    );

    treinoAtual = {};

    carregarPlantel();

    atualizarResumo();

    alert(
        "Treino criado com sucesso."
    );

}

async function abrirTreino(){

    const data =

        document.getElementById(
            "dataTreino"
        ).value;

    if(
        !data
    ){

        alert(
            "Seleciona uma data."
        );

        return;

    }

    const snap =

    await window.firebaseGetDoc(

        window.firebaseDoc(
            window.firebaseDB,
            "treinos",
            data
        )

    );

    if(
        !snap.exists()
    ){

        alert(
            "Treino inexistente."
        );

        return;

    }

    treinoAtual =
    snap.data();

    carregarPlantel();

    atualizarResumo();

}

async function marcarPresenca(
    jogador,
    estado
){

    const data =

    document.getElementById(
        "dataTreino"
    ).value;

    if(
        !data
    ){

        alert(
            "Seleciona uma data."
        );

        return;

    }

    treinoAtual[
        jogador
    ] = estado;

    await window.firebaseSetDoc(

        window.firebaseDoc(
            window.firebaseDB,
            "treinos",
            data
        ),

        {
            [jogador]:
            estado
        },

        {
            merge:true
        }

    );

    atualizarResumo();

    carregarPlantel();

}

function carregarPlantel(){

    let html = "";

    const grupos = [

        {
            titulo:"🧤 Guarda-Redes",
            lista:PLANTEL.guardaRedes
        },

        {
            titulo:"🛡️ Defesas",
            lista:PLANTEL.defesas
        },

        {
            titulo:"⚙️ Médios",
            lista:PLANTEL.medios
        },

        {
            titulo:"🎯 Avançados",
            lista:PLANTEL.avancados
        }

    ];

    grupos.forEach(grupo => {

        html += `

        <div class="card">

            <div class="titulo">

                ${grupo.titulo}

            </div>

        `;

        grupo.lista.forEach(nome => {

            const estado =
            treinoAtual[nome] || "";

            html += `

            <div class="jogador">

                <div>

                    <strong>
                        ${nome}
                    </strong>

                    ${
                        estado
                        ?
                        `
                        <div style="
                            margin-top:5px;
                            color:#facc15;
                            font-size:12px;
                        ">
                            Estado:
                            ${estado}
                        </div>
                        `
                        :
                        ""
                    }

                </div>

                <div class="botoes">

                    <button
                    onclick="
                    marcarPresenca(
                    '${nome}',
                    '✅'
                    )">

                    ✅

                    </button>

                    <button
                    onclick="
                    marcarPresenca(
                    '${nome}',
                    '❌'
                    )">

                    ❌

                    </button>

                    <button
                    onclick="
                    marcarPresenca(
                    '${nome}',
                    '🩺'
                    )">

                    🩺

                    </button>

                    <button
                    onclick="
                    marcarPresenca(
                    '${nome}',
                    '🟨'
                    )">

                    🟨

                    </button>

                </div>

            </div>

            `;

        });

        html += `
        </div>
        `;

    });

    document.getElementById(
        "plantel"
    ).innerHTML =
    html;

}

function atualizarResumo(){

    let presentes = 0;
    let faltas = 0;
    let lesionados = 0;
    let justificadas = 0;

    Object.values(
        treinoAtual
    ).forEach(v => {

        if(v === "✅"){
            presentes++;
        }

        if(v === "❌"){
            faltas++;
        }

        if(v === "🩺"){
            lesionados++;
        }

        if(v === "🟨"){
            justificadas++;
        }

    });

    document.getElementById(
        "kpiPresentes"
    ).innerText =
    presentes;

    document.getElementById(
        "kpiFaltas"
    ).innerText =
    faltas;

    document.getElementById(
        "kpiLesionados"
    ).innerText =
    lesionados;

    document.getElementById(
        "kpiJustificadas"
    ).innerText =
    justificadas;

}

function atualizarEstatisticas(){

    let presentes = 0;
    let faltas = 0;
    let lesionados = 0;
    let justificadas = 0;

    Object.values(
        treinoAtual
    ).forEach(v => {

        if(v === "✅"){
            presentes++;
        }

        if(v === "❌"){
            faltas++;
        }

        if(v === "🩺"){
            lesionados++;
        }

        if(v === "🟨"){
            justificadas++;
        }

    });

    const totalPlantel =

        PLANTEL.guardaRedes.length +
        PLANTEL.defesas.length +
        PLANTEL.medios.length +
        PLANTEL.avancados.length;

    const registados =

        presentes +
        faltas +
        lesionados +
        justificadas;

    const percentagem =

        totalPlantel > 0

        ? Math.round(
            (presentes / totalPlantel)
            * 100
        )

        : 0;

    document.getElementById(
        "estatisticasMister"
    ).innerHTML =

    `
    <div class="jogador">

        <span>
            👥 Plantel Total
        </span>

        <strong>
            ${totalPlantel}
        </strong>

    </div>

    <div class="jogador">

        <span>
            ✅ Presentes
        </span>

        <strong>
            ${presentes}
        </strong>

    </div>

    <div class="jogador">

        <span>
            ❌ Faltas
        </span>

        <strong>
            ${faltas}
        </strong>

    </div>

    <div class="jogador">

        <span>
            🩺 Lesionados
        </span>

        <strong>
            ${lesionados}
        </strong>

    </div>

    <div class="jogador">

        <span>
            🟨 Justificadas
        </span>

        <strong>
            ${justificadas}
        </strong>

    </div>

    <div class="jogador">

        <span>
            📝 Registos
        </span>

        <strong>
            ${registados}
        </strong>

    </div>

    <div class="jogador">

        <span>
            📊 Taxa Presença
        </span>

        <strong>
            ${percentagem}%
        </strong>

    </div>
    `;

}

console.log(
    "Área Técnica V2 carregada"
);

</script>

</body>
</html>
