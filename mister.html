<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Área Mister</title>

<style>

:root{

    --bg:#000;
    --card:#13213a;
    --card2:#1c2d4a;

    --yellow:#facc15;
    --green:#22c55e;
    --red:#ef4444;

    --text:#fff;

}

*{

    margin:0;
    padding:0;
    box-sizing:border-box;

}

body{

    background:var(--bg);
    color:var(--text);

    font-family:
    Segoe UI,
    Arial,
    sans-serif;

    padding:12px;

}

.container{

    max-width:1000px;
    margin:auto;

}

.card{

    background:var(--card);

    border-radius:20px;

    padding:20px;

    margin-bottom:12px;

}

input{

    width:100%;

    padding:12px;

    border:none;

    border-radius:10px;

    margin-bottom:10px;

}

.btn{

    width:100%;

    padding:12px;

    border:none;

    border-radius:10px;

    cursor:pointer;

    background:#314b77;

    color:white;

}

.btn:hover{

    opacity:.9;

}

.jogador{

    background:var(--card2);

    padding:12px;

    border-radius:12px;

    margin-bottom:8px;

    display:flex;

    justify-content:space-between;

    align-items:center;

}

.botoes{

    display:flex;

    gap:4px;

}

.botoes button{

    border:none;

    border-radius:10px;

    padding:8px 10px;

    cursor:pointer;

}

.kpi{

    background:var(--card2);

    padding:12px;

    border-radius:12px;

    margin-bottom:8px;

}

strong{

    color:var(--yellow);

}

</style>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";

import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    collection,
    getDocs
}
from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const firebaseConfig = {

    apiKey:"AIzaSyBCJOZqbFQRByk6hYyeCrqntyPBHW8pZbA",

    authDomain:
    "rdm-v2-98d5b.firebaseapp.com",

    projectId:
    "rdm-v2-98d5b",

    storageBucket:
    "rdm-v2-98d5b.firebasestorage.app",

    messagingSenderId:
    "847254286305",

    appId:
    "1:847254286305:web:eb5d179fb7ed6e5054eca0"

};

const app =
initializeApp(firebaseConfig);

window.firebaseDB =
getFirestore(app);

window.firebaseDoc =
doc;

window.firebaseGetDoc =
getDoc;

window.firebaseSetDoc =
setDoc;

window.firebaseCollection =
collection;

window.firebaseGetDocs =
getDocs;

window.firebaseReady =
true;

console.log(
    "Firebase OK"
);

</script>

</head>

<body>

<div class="container">

    <div id="login">

        <div class="card">

            <h2>
                🧑‍🏫 Área Mister
            </h2>

            <br>

            <input
                type="password"
                id="password"
                placeholder="Password Mister">

            <button
                class="btn"
                onclick="entrar()">

                Entrar

            </button>

        </div>

    </div>

    <div id="areaMister"
         style="display:none">

        <div class="card">

            <h2>
                📅 Gestão de Treino
            </h2>

            <br>

            <input
                type="date"
                id="dataTreino">

            <button
                class="btn"
                onclick="criarTreino()">

                ➕ Criar Treino

            </button>

            <br><br>

            <button
                class="btn"
                onclick="abrirTreino()">

                📂 Abrir Treino

            </button>

        </div>

        <div class="card">

            <h2>
                📊 Resumo do Treino Atual
            </h2>

            <br>

            <div id="resumo">

                ✅ 0

                <br>

                ❌ 0

                <br>

                🩺 0

                <br>

                🟨 0

            </div>

        </div>

        <div class="card">

            <h2>
                📈 Estatísticas da Época
            </h2>

            <br>

            <div id="estatisticasTreinos">

                A calcular...

            </div>

        </div>

        <div class="card">

            <h2>
                📋 Controlo de Presenças
            </h2>

            <br>

            <div id="plantel">

                A carregar plantel...

            </div>

        </div>

    </div>

</div>

<script>

const PASSWORD = "MISTER2026";

const PLANTEL = [

    "Filipe Pereira",
    "Julio Brandão",
    "Henrique Macedo",
    "Renan Lima",

    "Daniel Monteiro",
    "Gonçalo Silva",
    "Bruno Calvinho",
    "André Pécurto",
    "Robert Andrade",
    "João Rodrigues",
    "Nuno Gomes",
    "Bernas",

    "Miguel Fonseca",
    "Bruno Mota",
    "Rodrigo Tomé",
    "Pedro Paulino",
    "João Rascão",
    "Khalifa",
    "Diogo Correia",
    "Rodrigo Delgado",

    "Henrique Martins",
    "Guilherme Azevedo",
    "Jota",
    "Diogo Teixeira",
    "David Sousa",
    "Kala Furtado",
    "Sana Sambu"

];

let treinoAtual = {};

document.addEventListener(
    "DOMContentLoaded",
    () => {

        document.getElementById(
            "dataTreino"
        ).value =
        new Date()
        .toISOString()
        .split("T")[0];

    }
);

function entrar(){

    const pass =
    document.getElementById(
        "password"
    ).value;

    if(
        pass !== PASSWORD
    ){

        alert(
            "Password incorreta"
        );

        return;

    }

    document.getElementById(
        "login"
    ).style.display =
    "none";

    document.getElementById(
        "areaMister"
    ).style.display =
    "block";

    carregarPlantel();

    atualizarEstatisticas();

}

async function criarTreino(){

    const data =
    document.getElementById(
        "dataTreino"
    ).value;

    if(
        !data
    ){

        alert(
            "Seleciona uma data."
        );

        return;

    }

    await window.firebaseSetDoc(

        window.firebaseDoc(
            window.firebaseDB,
            "treinos",
            data
        ),

        {
            ativo:true,
            criadoEm:Date.now()
        },

        {
            merge:true
        }

    );

    treinoAtual = {};

    carregarPlantel();

    atualizarResumo();

    atualizarEstatisticas();

    alert(
        "Treino criado com sucesso."
    );

}

async function abrirTreino(){

    const data =
    document.getElementById(
        "dataTreino"
    ).value;

    if(
        !data
    ){

        alert(
            "Seleciona uma data."
        );

        return;

    }

    const snap =

    await window.firebaseGetDoc(

        window.firebaseDoc(
            window.firebaseDB,
            "treinos",
            data
        )

    );

    if(
        !snap.exists()
    ){

        alert(
            "Treino inexistente."
        );

        return;

    }

    treinoAtual =
    snap.data();

    carregarPlantel();

    atualizarResumo();

    atualizarEstatisticas();

}

async function marcarPresenca(
    jogador,
    estado
){

    const data =
    document.getElementById(
        "dataTreino"
    ).value;

    if(
        !data
    ){

        alert(
            "Seleciona uma data."
        );

        return;

    }

    treinoAtual[
        jogador
    ] = estado;

    await window.firebaseSetDoc(

        window.firebaseDoc(
            window.firebaseDB,
            "treinos",
            data
        ),

        {
            [jogador]: estado
        },

        {
            merge:true
        }

    );

    atualizarResumo();

    atualizarEstatisticas();

    carregarPlantel();

}

function carregarPlantel(){

    let html = "";

    PLANTEL.forEach(nome => {

        const estado =
        treinoAtual[nome] || "";

        html += `

        <div class="jogador">

            <div>

                <strong>
                    ${nome}
                </strong>

                ${
                    estado
                    ? `
                    <div style="
                        font-size:12px;
                        margin-top:4px;
                        color:#facc15;
                    ">
                        Estado: ${estado}
                    </div>
                    `
                    : ""
                }

            </div>

            <div class="botoes">

                <button onclick="marcarPresenca('${nome}','✅')">
                    ✅
                </button>

                <button onclick="marcarPresenca('${nome}','❌')">
                    ❌
                </button>

                <button onclick="marcarPresenca('${nome}','🩺')">
                    🩺
                </button>

                <button onclick="marcarPresenca('${nome}','🟨')">
                    🟨
                </button>

            </div>

        </div>

        `;

    });

    document.getElementById(
        "plantel"
    ).innerHTML =
    html;

}

function atualizarResumo(){

    let presentes = 0;
    let faltas = 0;
    let lesionados = 0;
    let justificadas = 0;

    Object.values(
        treinoAtual
    ).forEach(v => {

        if(v === "✅") presentes++;
        if(v === "❌") faltas++;
        if(v === "🩺") lesionados++;
        if(v === "🟨") justificadas++;

    });

    document.getElementById(
        "resumo"
    ).innerHTML =

    `
    ✅ ${presentes}
    <br>
    ❌ ${faltas}
    <br>
    🩺 ${lesionados}
    <br>
    🟨 ${justificadas}
    `;

}

async function atualizarEstatisticas(){

    let numeroTreinos = 0;
    let totalPresencas = 0;
    let totalFaltas = 0;
    let totalJustificadas = 0;

    const jogadores = {};

    PLANTEL.forEach(nome => {

        jogadores[nome] = {

            presentes:0

        };

    });

    try{

        const docs =

        await window.firebaseGetDocs(

            window.firebaseCollection(
                window.firebaseDB,
                "treinos"
            )

        );

        docs.forEach(doc => {

            const treino =
            doc.data();

            if(
                treino.ativo !== true
            ){
                return;
            }

            numeroTreinos++;

            Object.entries(
                treino
            ).forEach(([nome,estado]) => {

                if(
                    !jogadores[nome]
                ){
                    return;
                }

                if(
                    estado === "✅"
                ){

                    totalPresencas++;

                    jogadores[nome]
                    .presentes++;

                }

                if(
                    estado === "❌"
                ){
                    totalFaltas++;
                }

                if(
                    estado === "🟨"
                ){
                    totalJustificadas++;
                }

            });

        });

        const topAssiduos =

        Object.entries(
            jogadores
        )

        .sort(
            (a,b)=>
            b[1].presentes -
            a[1].presentes
        )

        .slice(0,5);

        const media =
        numeroTreinos === 0

        ? 0

        : Math.round(

            (
                totalPresencas
                /
                (
                    numeroTreinos *
              EL.length
                )
            ) * 100

        );

        let html = `

        <div class="kpi">

            📅 <strong>
            Treinos Realizados
            </strong>

            <br><br>

            ${numeroTreinos}

        </div>

        <br>

        <div class="kpi">

            ✅ <strong>
            Presenças Registadas
            </strong>

            <br><br>

            ${totalPresencas}

        </div>

        <br>

        <div class="kpi">

            ❌ <strong>
            Faltas Registadas
            </strong>

            <br><br>

            ${totalFaltas}

        </div>

        <br>

        <div class="kpi">

            🟨 <strong>
            Justificações
            </strong>

            <br><br>

            ${totalJustificadas}

        </div>

        <br>

        <h3>
            🏆 Top 5 Mais Assíduos
        </h3>

        <br>

        `;

        topAssiduos.forEach((j,i)=>{

            html += `

            <div class="kpi">

                ${i+1}. ${j[0]}

                <br>

                ✅ ${j[1].presentes}

            </div>

            <br>

            `;

        });

        html += `

        <h3>
            📈 Assiduidade Média
        </h3>

        <br>

        <div class="kpi">

            <strong>
                ${media}%
            </strong>

        </div>

        `;

        document.getElementById(
            "estatisticasTreinos"
        ).innerHTML =
        html;

    }
    catch(erro){

        console.log(
            erro
        );

        document.getElementById(
            "estatisticasTreinos"
        ).innerHTML =
        "Erro ao carregar estatísticas";

    }

}

/* IMPORTANTE PARA OS ONCLICK */

window.entrar = entrar;
window.criarTreino = criarTreino;
window.abrirTreino = abrirTreino;
window.marcarPresenca = marcarPresenca;

console.log(
    "Área Mister carregada"
);

</script>

</body>
</html>
