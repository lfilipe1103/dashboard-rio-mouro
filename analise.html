<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>
    Sala de Análise
</title>

<style>

:root{

    --bg:#06111f;
    --card:#13213a;
    --card2:#1c2d4a;

    --green:#22c55e;
    --yellow:#facc15;
    --red:#ef4444;
    --blue:#3b82f6;

}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:
    radial-gradient(
        circle at top,
        #10203d,
        #06111f
    );

    color:white;

    font-family:
    "Segoe UI",
    Arial,
    sans-serif;

    padding:15px;

}

.container{

    max-width:1000px;
    margin:auto;

}

.card{

    background:
    linear-gradient(
        180deg,
        #13213a,
        #1c2d4a
    );

    border-radius:24px;

    padding:20px;

    margin-bottom:15px;

    box-shadow:
        0 10px 35px
        rgba(
            0,
            0,
            0,
            .35
        );

}

.hero{

    text-align:center;

}

.logo{

    width:110px;

    margin-bottom:15px;

}

.hero-titulo{

    color:#9fb0c9;

    letter-spacing:2px;

    margin-bottom:10px;

}

.hero-posicao{

    font-size:90px;

    font-weight:900;

    color:var(--yellow);

}

.hero-pontos{

    font-size:34px;

    font-weight:900;

}

.titulo{

    font-size:24px;

    font-weight:900;

    text-align:center;

    margin-bottom:20px;

}

.grid{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:12px;

}

.kpi{

    background:var(--card2);

    border-radius:18px;

    padding:18px;

    text-align:center;

}

.kpi-num{

    font-size:42px;

    font-weight:900;

}

.kpi-label{

    margin-top:8px;

    color:#c6d2e4;

}

.box{

    background:var(--card2);

    border-radius:18px;

    padding:18px;

    margin-bottom:12px;

}

.linha{

    background:var(--card2);

    border-radius:14px;

    padding:14px;

    margin-bottom:10px;

    display:flex;

    justify-content:space-between;

}

.verde{
    color:var(--green);
}

.amarelo{
    color:var(--yellow);
}

.vermelho{
    color:var(--red);
}

.impacto{

    border-left:6px solid;

    padding:16px;

    margin-bottom:12px;

    border-radius:12px;

    background:var(--card2);

    line-height:1.7;

}

.alerta{
    border-color:var(--yellow);
}

.sucesso{
    border-color:var(--green);
}

.risco{
    border-color:var(--red);
}

.botao{

    width:100%;

    padding:18px;

    border:none;

    border-radius:18px;

    background:
    linear-gradient(
        135deg,
        #35589b,
        #4a78d1
    );

    color:white;

    font-size:18px;

    font-weight:800;

    cursor:pointer;

}

@media(max-width:850px){

    .grid{

        grid-template-columns:1fr;

    }

}

</style>

</head>

<body>

<div class="container">

<div class="card hero">

    <img
        src="logo.png"
        class="logo">

    <div class="hero-titulo">

        SALA DE ANÁLISE

    </div>

    <div
        id="heroPosicao"
        class="hero-posicao">

        -

    </div>

    <div
        id="heroPontos"
        class="hero-pontos">

        -

    </div>

</div>

<div class="card">

    <div class="titulo">

        ⚔️ Comparador de Equipas

    </div>

    <div id="comparador">

    </div>

</div>

<div class="card">

    <div class="titulo">

        🔎 Scouting Adversário

    </div>

    <div id="scouting">

    </div>

</div>

<div class="card">

    <div class="titulo">

        🤖 Assistente do Mister

    </div>

    <div id="assistente">

    </div>

</div>

<div class="card">

    <button
        class="botao"
        onclick="
            location.href='index.html'
        ">

        ⬅️ Voltar

    </button>

</div>

<div
    id="atualizacao"
    style="
    text-align:center;
    color:#9fb0c9;
    ">

</div>

</div>

<script>

async function carregar(){

    const rDashboard =
        await fetch(
            "dashboard_data.json?t="
            + Date.now()
        );

    const rJogadores =
        await fetch(
            "jogadores.json?t="
            + Date.now()
        );

    const rJornada =
        await fetch(
            "jornada.json?t="
            + Date.now()
        );

    const dashboard =
        await rDashboard.json();

    const jogadores =
        await rJogadores.json();

    const jornada =
        await rJornada.json();

    const resumo =
        dashboard.resumo_epoca || {};

    const classificacao =
        dashboard.classificacao || [];

    const adversario =
        dashboard.dashboard.adversario || {};

    const risco =
        dashboard.seniores?.cartoes?.risco || [];

    /* ==========================
       HERO
    ========================== */

    document.getElementById(
        "heroPosicao"
    ).innerText =

    resumo.posicao + "º";

    document.getElementById(
        "heroPontos"
    ).innerText =

    resumo.pontos + " pontos";

    /* ==========================
       COMPARADOR
    ========================== */

    let comparador = `

    <div class="grid">

        <div class="kpi">

            <div class="kpi-num amarelo">

                ${resumo.posicao}º

            </div>

            <div class="kpi-label">

                Rio de Mouro

            </div>

        </div>

        <div class="kpi">

            <div class="kpi-num">

                ${adversario.posicao}º

            </div>

            <div class="kpi-label">

                ${adversario.nome}

            </div>

        </div>

        <div class="kpi">

            <div class="kpi-num verde">

                ${resumo.pontos}

            </div>

            <div class="kpi-label">

                Pontos

            </div>

        </div>

        <div class="kpi">

            <div class="kpi-num">

                ${adversario.pontos}

            </div>

            <div class="kpi-label">

                Pontos

            </div>

        </div>

        <div class="kpi">

            <div class="kpi-num verde">

                ${resumo.dg}

            </div>

            <div class="kpi-label">

                DG

            </div>

        </div>

        <div class="kpi">

            <div class="kpi-num vermelho">

                ${adversario.dg}

            </div>

            <div class="kpi-label">

                DG

            </div>

        </div>

    </div>

    <br>

    <div class="box">

        ✅ Melhor classificação

        <br>

        ✅ Mais pontos

        <br>

        ✅ Melhor diferença de golos

        <br>

        🎯 Favoritismo do Rio de Mouro

    </div>

    `;

    document.getElementById(
        "comparador"
    ).innerHTML = comparador;

    /* ==========================
       SCOUTING ADVERSARIO
    ========================== */

    document.getElementById(
        "scouting"
    ).innerHTML = `

    <div class="box">

        <strong>

            ${adversario.nome}

        </strong>

        <br><br>

        Posição:
        ${adversario.posicao}º

        <br>

        Pontos:
        ${adversario.pontos}

        <br>

        Vitórias:
        ${adversario.vitorias}

        <br>

        Empates:
        ${adversario.empates}

        <br>

        Derrotas:
        ${adversario.derrotas}

        <br>

        Golos Marcados:
        ${adversario.gm}

        <br>

        Golos Sofridos:
        ${adversario.gs}

        <br>

        Diferença:
        ${adversario.dg}

    </div>

    <div class="box">

        ⚠️ Sofre muitos golos

        <br>

        ⚠️ Diferença negativa

        <br>

        ⚠️ Classificação baixa

    </div>

    `;

    /* ==========================
       MELHOR MARCADOR
    ========================== */

    const goleador =

        [...jogadores]

        .sort(
            (a,b)=>
            Number(b.golos || 0)
            -
            Number(a.golos || 0)
        )[0];

    const minutos =

        [...jogadores]

        .sort(
            (a,b)=>
            Number(b.minutos || 0)
            -
            Number(a.minutos || 0)
        )[0];

    const amarelos =

        [...jogadores]

        .sort(
            (a,b)=>
            Number(b.amarelos || 0)
            -
            Number(a.amarelos || 0)
        )[0];

    /* ==========================
       ASSISTENTE
    ========================== */

    let assistente = "";

    assistente += `

    <div class="impacto sucesso">

        <strong>

            🎯 Oportunidade

        </strong>

        <br><br>

        Rio de Mouro está

        a apenas

        1 ponto

        do 2º lugar.

    </div>

    `;

    const confrontoDireto =
        jornada.jogos.find(j =>

            (
                j.casa.includes(
                    "Arsenal"
                )

                &&

                j.fora.includes(
                    "Mem Martins"
                )

            )

            ||

            (
                j.casa.includes(
                    "Mem Martins"
                )

                &&

                j.fora.includes(
                    "Arsenal"
                )

            )

        );

    if(confrontoDireto){

        assistente += `

        <div class="impacto alerta">

            <strong>

                ⚠️ Jornada Importante

            </strong>

            <br><br>

            Arsenal 72 enfrenta

            Mem Martins SC.

            <br><br>

            Um dos rivais diretos

            poderá perder pontos.

        </div>

        `;

    }

    if(risco.length){

        assistente += `

        <div class="impacto risco">

            <strong>

                🟨 Gestão Disciplinar

            </strong>

            <br><br>

            Existem

            ${risco.length}

            jogadores em risco

            de suspensão.

        </div>

        `;

    }

    assistente += `

    <div class="impacto sucesso">

        <strong>

            🏅 Destaques

        </strong>

        <br><br>

        ⚽ ${goleador.nome}

        (${goleador.golos} golos)

        <br>

        ⏱️ ${minutos.nome}

        (${minutos.minutos} min)

        <br>

        🟨 ${amarelos.nome}

        (${amarelos.amarelos} amarelos)

    </div>

    `;

    assistente += `

    <div class="impacto alerta">

        <strong>

            ✅ Recomendação

        </strong>

        <br><br>

        Entrar para vencer.

        <br>

        Aproveitar possível deslize

        dos rivais diretos.

        <br>

        Manter pressão

        sobre os dois primeiros.

    </div>

    `;

    document.getElementById(
        "assistente"
    ).innerHTML = assistente;

    document.getElementById(
        "atualizacao"
    ).innerHTML =

    "Atualizado: "

    +

    (
        dashboard
        .ultima_atualizacao
        ||
        "-"
    );

}

carregar();

</script>

</body>

</html>
