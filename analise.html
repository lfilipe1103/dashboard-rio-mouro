<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>
    Scouting Adversário
</title>

<style>

:root{

    --bg:#06111f;
    --card:#13213a;
    --card2:#1c2d4a;

    --green:#22c55e;
    --yellow:#facc15;
    --red:#ef4444;
    --blue:#3b82f6;

}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:
    radial-gradient(
        circle at top,
        #10203d,
        #06111f
    );

    color:white;

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    padding:15px;

}

.container{

    max-width:1000px;
    margin:auto;

}

.card{

    background:
        linear-gradient(
            180deg,
            #13213a,
            #1c2d4a
        );

    border-radius:24px;

    padding:20px;

    margin-bottom:15px;

    box-shadow:
        0 10px 35px
        rgba(
            0,
            0,
            0,
            .35
        );

}

.hero{

    text-align:center;

}

.logo{

    width:110px;

    margin-bottom:15px;

}

.hero-title{

    color:#9fb0c9;

    letter-spacing:2px;

    margin-bottom:10px;

}

.hero-adversario{

    font-size:52px;

    font-weight:900;

    color:var(--yellow);

}

.hero-perfil{

    margin-top:15px;

    font-size:22px;

    font-weight:700;

}

.hero-risco{

    margin-top:10px;

    font-size:30px;

    font-weight:900;

}

.titulo{

    font-size:24px;

    font-weight:900;

    text-align:center;

    margin-bottom:20px;

}

.grid{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:12px;

}

.kpi{

    background:var(--card2);

    border-radius:18px;

    padding:18px;

    text-align:center;

}

.kpi-num{

    font-size:42px;

    font-weight:900;

}

.kpi-label{

    color:#c5d1e3;

    margin-top:8px;

}

.verde{
    color:var(--green);
}

.amarelo{
    color:var(--yellow);
}

.vermelho{
    color:var(--red);
}

.azul{
    color:var(--blue);
}

.box{

    background:var(--card2);

    border-radius:18px;

    padding:18px;

    margin-bottom:12px;

}

.jogador{

    background:var(--card2);

    border-radius:16px;

    padding:15px;

    margin-bottom:10px;

}

.nome{

    font-size:22px;

    font-weight:800;

}

.info{

    color:#c7d4e5;

    margin-top:8px;

}

.alerta{

    border-left:
        6px solid
        var(--yellow);

}

.forte{

    border-left:
        6px solid
        var(--green);

}

.fraco{

    border-left:
        6px solid
        var(--red);

}

.btn{

    width:100%;

    border:none;

    border-radius:18px;

    padding:18px;

    background:
        linear-gradient(
            135deg,
            #35589b,
            #4a78d1
        );

    color:white;

    font-size:18px;

    font-weight:800;

    cursor:pointer;

}

@media(max-width:900px){

    .grid{

        grid-template-columns:1fr;

    }

}

</style>

</head>

<body>

<div class="container">

<div class="card hero">

    <img
        src="logo.png"
        class="logo">

    <div class="hero-title">

        🔎 SCOUTING ADVERSÁRIO

    </div>

    <div
        id="adversario"
        class="hero-adversario">

        ...

    </div>

    <div
        id="perfil"
        class="hero-perfil">

        ...

    </div>

    <div
        id="perigo"
        class="hero-risco">

        ...

    </div>

</div>

<!-- JOGADORES CHAVE -->

<div class="card">

    <div class="titulo">

        🎯 Jogadores-Chave

    </div>

    <div class="grid">

        <div class="kpi">

            <div
                id="melhorMarcadorNome">

                -

            </div>

            <div
                id="melhorMarcadorValor"
                class="kpi-num verde">

                -

            </div>

            <div class="kpi-label">

                Melhor Marcador

            </div>

        </div>

        <div class="kpi">

            <div
                id="maisUtilizadoNome">

                -

            </div>

            <div
                id="maisUtilizadoValor"
                class="kpi-num amarelo">

                -

            </div>

            <div class="kpi-label">

                Mais Utilizado

            </div>

        </div>

        <div class="kpi">

            <div
                id="maisAmarelosNome">

                -

            </div>

            <div
                id="maisAmarelosValor"
                class="kpi-num vermelho">

                -

            </div>

            <div class="kpi-label">

                Mais Amarelos

            </div>

        </div>

    </div>

</div>

<!-- ONZE PROVÁVEL -->

<div class="card">

    <div class="titulo">

        📋 Onze Provável

    </div>

    <div
        id="onzeProvavel">

    </div>

</div>

<!-- JOGADORES A CONDICIONAR -->

<div class="card">

    <div class="titulo">

        🚫 Jogadores a Condicionar

    </div>

    <div
        id="jogadoresCondicionar">

    </div>

</div>

<!-- ARMAS OFENSIVAS -->

<div class="card">

    <div class="titulo">

        ⚽ Armas Ofensivas

    </div>

    <div
        id="armasOfensivas">

    </div>

</div>

<!-- IMPACTO DO BANCO -->

<div class="card">

    <div class="titulo">

        🔥 Impacto Banco

    </div>

    <div
        id="impactoBanco">

    </div>

</div>

<!-- PONTOS FORTES -->

<div class="card">

    <div class="titulo">

        ✅ Pontos Fortes

    </div>

    <div
        id="pontosFortes">

    </div>

</div>

<!-- PONTOS FRACOS -->

<div class="card">

    <div class="titulo">

        ⚠️ Pontos Fracos

    </div>

    <div
        id="pontosFracos">

    </div>

</div>

<!-- ALERTAS -->

<div class="card">

    <div class="titulo">

        🚨 Alertas

    </div>

    <div
        id="alertas">

    </div>

</div>

<!-- RECOMENDAÇÕES -->

<div class="card">

    <div class="titulo">

        🎯 Recomendações

    </div>

    <div
        id="recomendacoes">

    </div>

</div>

<!-- RESUMO TÉCNICO -->

<div class="card">

    <div class="titulo">

        🧠 Resumo Técnico

    </div>

    <div
        id="resumoTecnico">

    </div>

</div>

<!-- VOLTAR -->

<div class="card">

    <button
        class="btn"
        onclick="
            location.href='index.html'
        ">

        ⬅️ Voltar ao Menu

    </button>

</div>

<script>

async function carregar(){

    const response =
        await fetch(
            "adversario_jogadores.json?t="
            + Date.now()
        );

    const data =
        await response.json();

    document.getElementById(
        "adversario"
    ).innerText =
    data.adversario;

    document.getElementById(
        "perfil"
    ).innerText =
    data.perfil_equipa;

    document.getElementById(
        "perigo"
    ).innerText =

    "PERIGO "

    +

    data.indice_perigo.geral

    +

    "/10";

    document.getElementById(
        "melhorMarcadorNome"
    ).innerText =
    data.melhor_marcador.nome;

    document.getElementById(
        "melhorMarcadorValor"
    ).innerText =

    `⚽ ${data.melhor_marcador.golos}`;

    document.getElementById(
        "maisUtilizadoNome"
    ).innerText =
    data.mais_utilizado.nome;

    document.getElementById(
        "maisUtilizadoValor"
    ).innerText =

    `⏱️ ${data.mais_utilizado.minutos}`;

    document.getElementById(
        "maisAmarelosNome"
    ).innerText =
    data.mais_amarelos.nome;

    document.getElementById(
        "maisAmarelosValor"
    ).innerText =

    `🟨 ${data.mais_amarelos.amarelos}`;

    /* ==========================
       ONZE PROVÁVEL
    ========================== */

    let onzeHTML = "";

    data.onze_provavel.forEach(j=>{

        onzeHTML += `

        <div class="jogador">

            <div class="nome">

                ${j.nome}

            </div>

            <div class="info">

                ${j.posicao}

                •

                ${j.minutos} min

            </div>

        </div>

        `;

    });

    document.getElementById(
        "onzeProvavel"
    ).innerHTML =
    onzeHTML;

    /* ==========================
       JOGADORES A CONDICIONAR
    ========================== */

    let condicionarHTML = "";

    data.jogadores_a_condicionar
    .forEach(j => {

        condicionarHTML += `

        <div class="jogador">

            <div class="nome">

                ${j.nome}

            </div>

            <div class="info">

                ${j.posicao}

            </div>

        </div>

        `;

    });

    document.getElementById(
        "jogadoresCondicionar"
    ).innerHTML =
    condicionarHTML;

    /* ==========================
       ARMAS OFENSIVAS
    ========================== */

    let armasHTML = "";

    data.armas_ofensivas
    .forEach(j => {

        armasHTML += `

        <div class="jogador">

            <div class="nome">

                ${j.nome}

            </div>

            <div class="info">

                ⚽ ${j.golos} golos

                <br>

                ${j.motivo}

            </div>

        </div>

        `;

    });

    document.getElementById(
        "armasOfensivas"
    ).innerHTML =
    armasHTML;

    /* ==========================
       IMPACTO BANCO
    ========================== */

    let bancoHTML = "";

    data.impacto_banco
    .forEach(j => {

        bancoHTML += `

        <div class="jogador">

            <div class="nome">

                ${j.nome}

            </div>

            <div class="info">

                ⚽ ${j.golos} golos

                <br>

                ⏱️ ${j.minutos} min

                <br>

                📈 Eficiência:

                ${j.eficacia}

            </div>

        </div>

        `;

    });

    document.getElementById(
        "impactoBanco"
    ).innerHTML =
    bancoHTML;

    /* ==========================
       PONTOS FORTES
    ========================== */

    let fortesHTML = "";

    data.pontos_fortes
    .forEach(x => {

        fortesHTML += `

        <div class="
            box
            forte
        ">

            ✅ ${x}

        </div>

        `;

    });

    document.getElementById(
        "pontosFortes"
    ).innerHTML =
    fortesHTML;

    /* ==========================
       PONTOS FRACOS
    ========================== */

    let fracosHTML = "";

    data.pontos_fracos
    .forEach(x => {

        fracosHTML += `

        <div class="
            box
            fraco
        ">

            ⚠️ ${x}

        </div>

        `;

    });

    document.getElementById(
        "pontosFracos"
    ).innerHTML =
    fracosHTML;

    /* ==========================
       ALERTAS
    ========================== */

    let alertasHTML = "";

    data.alertas
    .forEach(x => {

        alertasHTML += `

        <div class="
            box
            alerta
        ">

            🚨 ${x}

        </div>

        `;

    });

    document.getElementById(
        "alertas"
    ).innerHTML =
    alertasHTML;

    /* ==========================
       RECOMENDAÇÕES
    ========================== */

    let recomendacoesHTML = "";

    data.recomendacoes
    .forEach(x => {

        recomendacoesHTML += `

        <div class="box">

            🎯 ${x}

        </div>

        `;

    });

    document.getElementById(
        "recomendacoes"
    ).innerHTML =
    recomendacoesHTML;

    /* ==========================
       RESUMO TÉCNICO
    ========================== */

    let resumoHTML = "";

    data.resumo_tecnico
    .forEach(x => {

        resumoHTML += `

        <div class="box">

            🧠 ${x}

        </div>

        `;

    });

    document.getElementById(
        "resumoTecnico"
    ).innerHTML =
    resumoHTML;

}

carregar();

</script>

</body>

</html>
